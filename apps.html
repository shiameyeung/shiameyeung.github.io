function render(lang, t) {
  document.getElementById('apps').innerHTML = APPS.map(a => `
    <section class="app" id="${a.id}" style="--tint:${a.tint};--tone:${a.tone};--paper:${a.paper}">
      <div class="app-head">
        <div class="app-title">
          <span class="app-badge" aria-hidden="true">${a.mark}</span>
          <div><h2>${t[a.id + '.title']}</h2><p class="host">${a.host}</p></div>
        </div>
        <div>
          <a class="enter" href="${a.url}" target="_blank" rel="noopener">${t[a.id + '.enter'] || t.enter}${ARROW}</a>
          ${a.locked ? `<span class="locked">${LOCK}${t.locked}</span>` : `<span class="locked">${t[a.id + '.open'] || t.open}</span>`}
        </div>
      </div>
      <p class="app-desc">${t[a.id + '.desc']}</p>
      <div class="scenes">
        ${a.scenes.map((build, i) => `
          <article class="scene">
            <div class="ui">${build(t)}</div>
            <div class="scene-body">
              <div class="scene-step">${t['story.' + (i + 1)]}</div>
              <p class="scene-cap">${t[a.id + '.s' + (i + 1)]}</p>
            </div>
          </article>`).join('')}
      </div>
    </section>`).join('');
}
