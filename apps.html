const SHOTS={aws:['home','mock','modes','question','glossary','nav','result','guide'],cal:['today','trend','formula','daily','body'],ootd:['wardrobe','today','looks','places','item','spending']};
function render(lang,t) {
  const all=['aws','cal','ootd','corp','sna'];
  let selected=new URLSearchParams(location.search).get('project');
  const legacy=location.hash.slice(1);
  if(!selected && all.includes(legacy)) { selected=legacy; const u=new URL(location);u.searchParams.set('project',selected);u.hash='';history.replaceState(null,'',u); }
  if(!all.includes(selected)) selected=null;
  const order=selected?[selected]:[];
  const head=document.querySelector('.page-head');
  if(selected) {
    head.querySelector('h1').textContent=t[selected+'.title'];
    head.querySelector('[data-t="page.lead"]').textContent=t[selected+'.desc'];
    head.querySelector('.page-note').hidden=true;
    document.title=t[selected+'.title']+' — '+(lang==='en'?'Yo Tenra':'楊 天楽');
  } else head.querySelector('.page-note').hidden=true;
  const card=id=>{const a=APPS.find(x=>x.id===id), actual=!!SHOTS[id];return `<a class="project-overview-card" href="apps.html?project=${id}">${actual?`<img src="assets/shots/${id}_${id==='aws'?'home':id==='cal'?'today':'wardrobe'}_${lang}.webp" alt="" loading="lazy">`:`<span class="overview-mark" aria-hidden="true">${a.mark}</span>`}<div><h2>${t[id+'.title'].split(' · ')[0]}</h2><p>${t[id+'.desc']}</p><span class="card-link">${SiteNavigation.label(lang,'nav.read')} →</span></div></a>`;};
  if(!selected) {
    document.getElementById('apps').innerHTML=`<div class="project-overview-grid">${all.slice(0,3).map(card).join('')}</div><section class="research-overview"><h2 class="section-heading" data-rail-key="chapter.research">${SiteNavigation.label(lang,'story.research')}</h2><div class="project-overview-grid research-grid">${all.slice(3).map(card).join('')}</div></section>`;
    return;
  }
  document.getElementById('apps').innerHTML=order.map(id=>{
    const a=APPS.find(x=>x.id===id), actual=!!SHOTS[id];
    return `<section class="app" id="${id}" style="--tint:${a.tint};--tone:${a.tone};--paper:${a.paper}">
    <div class="app-head"><div class="app-title"><span class="app-badge" aria-hidden="true">${a.mark}</span><div><p class="host">${a.host}</p></div></div><div><a class="enter" href="${a.url}" target="_blank" rel="noopener">${t['enter']} ↗</a>${a.locked?`<span class="locked">${t[id+'.locked']||t['locked']}</span>`:''}</div></div>

    ${actual?`<h2 class="app-section-heading" id="project-problem">${t['sec.problem']}</h2><p>${t[id+'.problem']}</p><h2 class="app-section-heading" id="project-features" data-rail-key="nav.features">${t['sec.features']}</h2><ul class="feature-list">${Array.from({length:id==='aws'?12:10},(_,i)=>`<li>${t[id+'.f'+(i+1)]}</li>`).join('')}</ul><h2 class="app-section-heading" id="project-demo" data-rail-key="nav.demo">${t['sec.demo']}</h2><div class="demo-grid" id="demos-${id}">${AppDemos.html(id,t)}</div><h2 class="app-section-heading" id="project-screens" data-rail-key="nav.screens">${t['sec.shots']}</h2><div class="shots">${SHOTS[id].map(v=>{const file=`assets/shots/${id}_${v}_${v==='guide'?'zh':lang}.webp`;return `<figure><a href="${file}" target="_blank" rel="noopener"><img src="${file}" loading="lazy" alt="${String(t[id+'.shot.'+v]).replaceAll('&','&amp;').replaceAll('"','&quot;')}" data-shot="${id}_${v}"></a><figcaption>${t[id+'.shot.'+v]}</figcaption></figure>`;}).join('')}</div><h2 class="app-section-heading" id="project-design" data-rail-key="nav.design">${t['sec.design']}</h2><p>${t[id+'.design']}</p><p class="stack"><b>${t['sec.stack']}</b> · ${t[id+'.stack']}</p>`:
    `<div class="scenes">${a.scenes.map((f,i)=>`<article class="scene"><div class="ui">${f(t)}</div><div class="scene-body"><span class="scene-step">${t['story.'+(i+1)]}</span><p class="scene-cap">${t[id+'.s'+(i+1)]}</p></div></article>`).join('')}</div>`}</section>`;
  }).join('');
  order.filter(id=>SHOTS[id]).forEach(id=>AppDemos.bind(id,t));
  document.querySelectorAll('[data-shot]').forEach(img=>img.onerror=()=>{if(!img.dataset.fallback){img.dataset.fallback='true';img.src=`assets/shots/${img.dataset.shot}_zh.webp`;img.closest('a').href=img.src;}});
}

    "corp.s3": "做成了从新闻文件到企业关系矩阵的 Web 工具，使用者在浏览器里上传、运行、下载即可。这是我从需求到部署完整推进的第一个开发项目：向 Gemini 和 ChatGPT 咨询并取得代码建议，自己整合，用 git 完成部署。",

    "sna.s1": "依赖列表能告诉我一个软件用了什么，却很难直接看出它在整个网络中的位置。我的研究将这些关系整理成可以比较、探索的图。",
    "sna.s2": "我把依赖数量、连接位置等不同指标放在一起，并将排名与图中的节点关联。说明文字依据指标和规则生成，方便回到图和数据检查依据。",
    "sna.s3": "公开 Demo 展示了含 709 个包的 Python 网络与 591 个包的 Go 网络，可以切换指标查看。它呈现依赖结构，为进一步调查提供线索。",

    "meta.description": "AWS 多认证备考、饮食与体重记录、衣橱与穿搭：三个可试用的 Web 应用，加上新闻企业关系抽取与开源依赖分析两个研究工具。",

    "aws.locked": "需要 Google 登录 · 目前只开放给本人和少数朋友",
    "aws.problem": "备考 AWS 认证时，我在中文、日文、英文的资料之间来回切换：概念要懂，三种语言里的术语也要认得。做题只知道对错不够，我想知道为什么对、为什么错、离合格线还有多远；卡住的题，最好能马上丢给 AI 继续讨论。于是做了一个自己用的刷题应用，考一门加一门题库，现在有 7 种考试。",
    "aws.f1": "7 种 AWS 认证（CLF-C02、SAA-C03、SAP-C02、AIF-C01、AIP-C01、DOP-C02、SCS-C03），顶栏切换，每门考试的进度分开保存。",
    "aws.f2": "每门考试按语言分别有题库：多数为中／英／日三语，AIF-C01 为中／英；各语言的题号和进度相互独立。",
    "aws.f3": "界面支持中文、日文和英文，自动匹配浏览器语言，并记住每门考试的语言；该考试没有对应语言题库时，界面与题库一起回退英文。",
    "aws.f4": "练习模式：顺序、随机、错题本、收藏夹、自定义范围、模拟考试，另有 10 题小练和派生题练习。",
    "aws.f5": "模拟考按真实考试设题数和时长（如 AIF-C01 65 题 90 分钟、SAA-C03 65 题 130 分钟、专业级 75 题 180 分钟），计时、标记待检查、未完成的草稿保存在本机可恢复、超时自动交卷；交卷后逐题回顾或只看错题。",
    "aws.f6": "分数预测：按最近几次模拟考加权（越近权重越高，逐次乘 0.7；未答完的考试按已答比例折半计权），给出预测分、可能区间、与合格线的对比、趋势和可信度；分数按练习目标折算到 100–1000 分制。",
    "aws.f7": "错题本与进度：做错的题自动进错题本，可以只练错题；首页显示题库总数、已练习、正确率、错题数。",
    "aws.f8": "术语悬停解释：题干、选项和解析里的术语自动加虚线下划线，悬停或点击显示解释；三种界面语言各有词表；模拟考进行中隐藏解释，交卷回顾时恢复。",
    "aws.f9": "一键复制题目给 AI：把当前题整理成 Markdown——开头是给 AI 的「回答要求」提示词，接着是考试、题库语言、题型、当前选择、题干、选项；作答或回顾之后才附答案与解析，作答前复制不剧透。粘到任何 AI 对话里就能继续学。",
    "aws.f10": "备考指南：AIF-C01 有一份按官方考纲 v1.1 编写的中文「考前冲刺手册」——考试规则、服务名翻译、「看到 X 选 Y」速查表、概念图解、易混对决、排除法、考场策略、新考点、自测题、速记卡、中英术语对照，共 13 章，首页有入口。",
    "aws.f11": "Google 登录与跨设备同步：登录后进度按账号存到云端，多台设备合并（逐题按时间戳取新）；账号白名单，目前只开放给本人和少数朋友。",
    "aws.f12": "可安装、可离线：装到桌面或手机主屏，缓存过的题库断网也能刷。另有题目导航（按答对／答错／未做／收藏筛选，搜题干或题号）、考试成绩记录（录入 AWS 成绩单分数，首页显示通过状态）、深浅色。",
    "aws.stack": "单页 Web 应用（HTML／CSS／JS），Cloudflare Pages 托管，Pages Functions 做同步后端，Cloudflare Access＋Google 身份源登录，KV 存进度；题库由 Python 脚本从 PDF 解析、清洗并生成，有结构与文本质量的校验脚本。",
    "aws.shot.home": "首页：顶栏切换考试与语言，显示进度、考试通过记录（我用它备考，2026 年考过了 AIF-C01）和「安装 Web App」入口。",
    "aws.shot.modes": "练习模式：顺序、10 题小练、随机、错题本、收藏夹、自定义范围、模拟考试。",
    "aws.shot.question": "作答后的解析：正确为什么对、错误为什么错；右上「复制题目」「题目导航」。",
    "aws.shot.glossary": "悬停带下划线的术语，出现解释浮层。",
    "aws.shot.nav": "题目导航：按答对／答错／未做／收藏筛选，可搜题干或题号。",
    "aws.shot.mock": "模拟考分析：按最近 3 次加权预测实考分数与区间，对比合格线，列出近期成绩。",
    "aws.shot.result": "模拟考成绩：题数、用时、折算分与合格线，可只看错题或逐题回顾。",
    "aws.shot.guide": "AIF-C01 备考指南（中文）：按官方考纲编写，分章节导航。",
    "aws.design": "把题库、术语表和解析放进同一个界面，复习时既能对照语言，也能回到具体概念。模拟考只抽原题、考中隐藏术语解释，交卷后回顾再显示，贴近真实考场；分数按练习目标折算到 100–1000 分制作参考。进度先存本机，登录只为跨设备同步，断网也能继续刷。",
    "cal.locked": "需要登录 · 单用户",
    "cal.problem": "2024 年 9 月到 2025 年 5 月，我从约 100 kg 减到约 65 kg，用的是一张表格：记每天吃了多少、体重怎么变，用这两样反推实际消耗，再按减重目标算出每天能吃多少，边观察边调整。减下来之后要维持，表格每天填太麻烦，我把同一套算法做成了 app：记录更快，目标自动算，进度实时看。",
    "cal.f1": "今天：还可以记多少 kcal、目标／已记录／最新体重、今日进度环；超过目标也只是提醒「明天继续就好」。",
    "cal.f2": "记一口吃的：食品库搜索（约 200 种，从原表格导入）、收藏与常用置顶、点食物即记录、自定义食品入库。",
    "cal.f3": "随手记一笔：最近吃过的一键填入，只填热量和备注；前天／昨天／今天／明天或任选日期。",
    "cal.f4": "体重与补录：记录体重并保留当时的日本时间戳，日期可另选；热量、体重、身体记录都能修改和删除，删除有确认。",
    "cal.f5": "每日归档：按月看每天的热量、本月有记录天数、已记录日均值和自动目标；每天点开管理当天的记录、补体重。",
    "cal.f6": "趋势：平均摄入、体重变化、推算消耗、每日目标四格；30 天每日热量柱状图（带目标线）；60 天体重曲线（标出两窗口均值）。",
    "cal.f7": "每日目标的算法直接写在页面上：① 近 30 日摄入均值 ＋ ② 双窗口体重校正 ＝ ③ 推算消耗；③ − ④ 月减目标折算的每日赤字 ＝ 每日目标。脚注列出两个窗口的均值与条数、能量系数。",
    "cal.f8": "数据不够就说不够：只有近 30 天每天有记录、两个体重窗口都有测量、结果为正，才显示自动目标；否则显示已记录天数、日均值和缺了哪些天。缺记录的日子算缺，不当成 0 kcal。",
    "cal.f9": "身体尺寸：记体脂率、腰围、上下胸围、臀围、腿围；自动算围差、参考罩杯与尺码（日本常用尺码）、腰臀比、腰高比、BMI、脂肪量与去脂体重；空缺项沿用最近一次实测值，处在尺码边界时给出两个候选。",
    "cal.f10": "中日双语界面；所有日界按日本时间（Asia/Tokyo）划分；一键导出全部记录为 CSV 或含食品库、收藏、目标设置的 JSON 备份；显示同步状态与手动刷新。",
    "cal.stack": "Web 应用，数据保存在云端数据库（Cloudflare D1），所有日期按日本时间划分；热量、体重、身体记录三类表，另有食品库。",
    "cal.shot.today": "今天：还能吃多少、目标／已记录／最新体重与进度环；右侧食品库搜索与收藏，下方「随手记一笔」。",
    "cal.shot.daily": "每日：按月看每天的热量，本月有记录天数、日均值与自动目标；每天可点开管理。",
    "cal.shot.trend": "趋势：平均摄入、体重变化、推算消耗、每日目标；每日热量柱状图与 60 天体重曲线。",
    "cal.shot.formula": "每日目标的算法写在页面上：30 日摄入均值 ＋ 双窗口体重校正 ＝ 推算消耗，减去月减目标折算的每日赤字。",
    "cal.shot.body": "身体尺寸：记录实测值，自动算围差、参考罩杯与尺码、腰臀比；空缺项沿用最近一次实测。",
    "cal.design": "保留表格时代那套算法，而不是换一个：每日目标的四步直接显示在页面上，数据不够时显示「—」和缺了几天，等记录补齐再给目标。记录尽量少按几下：常用食物置顶、最近吃过一键填、日期默认今天也随时可改。所有日界按日本时间划分，补录的日期不会被自动改写。",
    "ootd.locked": "需要 Google 登录 · 白名单",
    "ootd.problem": "衣服太多，常常找不到；很多衣服买了没穿几次，利用率低；想穿某件又不知道怎么搭。购物记录和衣柜是分开的，买过什么、放在哪、穿过几次、怎么搭，这些信息连不起来。我把它们连成一份档案：从购买导入开始，到收纳位置、每天的穿着记录、搭配，再到每件衣服的平均每次花费。",
    "ootd.f1": "衣橱档案与检索：每件单品有编号（如 TOP-0179）、分类、颜色、品牌、照片、标签；按名称、编号、颜色、品牌、位置、标签搜索，按主类／分类／位置／标签筛选，「只看还没穿过的」，按随便逛逛／最近加入／最近穿过排序。",
    "ootd.f2": "今天穿了：首页列「最近穿过」和「当季还没穿过（按最近买的排）」，点选多件一起记录；同一件同一天只算一次，重复点不会多加；衣橱列表和单品页也能一键「今天穿了」。",
    "ootd.f3": "收纳位置：柜子 → 层 → 格 → 内／外，每格显示已放件数和尺寸（宽×高×深）；点一格看放了哪些、这一格怎么放的建议，可「拿出来」，也可批量设置位置；「计划放哪」与「实际放哪」分开记录。",
    "ootd.f4": "单品详情：放在哪（格位与最后确认时间）、累计穿着、平均每次花费（实付 ÷ 有效穿着日，穿过一次就能算）、最近穿着、标签，以及「用这件搭」进入搭配。",
    "ootd.f5": "搭配本：官搭／收藏／自搭，每套关联真实单品，显示穿过次数与评分；打开一套就有按当前位置分组的取衣清单；「今天穿了这套」与单件记录自动去重；换组成开新版本，历史版本保留。",
    "ootd.f6": "消费回顾：合计、还没穿过的衣物金额、估算金额的笔数；按月／按年／按品牌／按分类；日元按固定汇率折算成人民币；缺金额的记录只计件数并另外标出。",
    "ootd.f7": "购买导入：从自建的购买记录库按分类（服饰、鞋包配饰、彩妆）导入单品，购入价、币种、日期、平台、订单号与商品图预填；先预演再正式导入，退款行跳过。",
    "ootd.f8": "AI 辅助标注：风格、季节、配色等标签由 AI 给出候选，经我确认后应用，低置信度的跳过，人工标签始终保留。",
    "ootd.f9": "衣橱与彩妆共用一套档案：字段与标签维度按主类显隐；彩妆同样有「今天用了」并去重；彩妆还可挂攻略要点。",
    "ootd.f10": "两种运行方式：本地版零依赖，Python 标准库 HTTP 服务＋SQLite，一条命令启动，整个数据文件夹复制即备份；云端版部署在 Cloudflare Workers（Python）＋Durable Object SQLite，域名 ootd.yotenra.com，Google 登录白名单。另有只读接口（MCP）让 AI 助手查询衣橱帮忙搭配。",
    "ootd.stack": "Python（标准库 HTTP 服务）＋SQLite，原生 HTML／CSS／JS 前端，无构建步骤；云端版 Cloudflare Workers（Python）＋Durable Object SQLite；Google 登录。",
    "ootd.shot.wardrobe": "我的衣橱：搜索与筛选（上装、最近加入），卡片显示收纳位置、风格标签、穿着状态。",
    "ootd.shot.today": "今天穿了什么：当季还没穿过的单品按最近购入排，点选后一起记录；同一件同一天只算一次。",
    "ootd.shot.looks": "搭配本：33 套搭配，每套关联单品、穿过次数与评分，选一套就知道每件放在哪。",
    "ootd.shot.places": "收纳位置：叠放柜／挂衣柜／贴身区域按格显示件数；点一格看放了哪些、格子尺寸，可拿出来。",
    "ootd.shot.spending": "消费回顾：合计、还没穿过的金额、估算部分；按月统计，另有按年、品牌、分类。",
    "ootd.shot.item": "单品详情：放在哪、累计穿着、平均每次花费、最近穿着、标签，以及「用这件搭」。",
    "ootd.design": "以「下一次用」为中心组织数据：同一件衣服同一天只算一次，穿着次数才可信；「计划放哪」和「实际放哪」分开，放进去点了「已放入」才算；每次花费只在有购入价和穿着记录时给数字，否则给原因。衣服和彩妆共用标签体系，一份档案两边用。界面用糖果色，让每天打开记一笔变成轻松的事。",

    "aws.desc": "An installable web app with offline practice for seven AWS certifications, Chinese, Japanese, and English question banks and interfaces, mock exams and score estimates, mistake review, glossary tooltips, and one-click copying into an AI chat.",
    "aws.s1": "When studying, I need to understand technical concepts and recognize their names in different languages. Memorizing answers alone makes it hard to see what I have not understood.",

    "corp.s1": "Our lab needed to extract company relationships from large volumes of news. Abbreviations and alternative names for the same company made manual normalization slow, while sending every article to a model created many repeated requests.",

    "aws.locked": "Google sign-in required · Currently limited to me and a few friends",
    "aws.problem": "While studying for AWS certifications, I moved between Chinese, Japanese, and English materials. I needed to understand the concepts and recognize the terminology in all three languages. A right-or-wrong result was not enough: I wanted to understand each option and see how close I was to passing. When I got stuck, I wanted to send the question straight to an AI chat. I built a practice app for myself, adding a question bank as I prepared for each exam. It now covers seven exams.",
    "aws.f1": "Seven AWS certifications: CLF-C02, SAA-C03, SAP-C02, AIF-C01, AIP-C01, DOP-C02, and SCS-C03. Switch exams in the top bar, with progress saved separately for each.",
    "aws.f2": "Separate question banks by language for each exam. Most have Chinese, English, and Japanese banks; AIF-C01 has Chinese and English. Question numbers and progress are independent in each language.",
    "aws.f3": "The interface supports three languages and follows the browser language: Chinese for Chinese, Japanese for Japanese, and English otherwise. If an exam has no question bank in that language, both the interface and question bank fall back to English. The app remembers the last language used for each exam.",
    "aws.f4": "Practice modes include sequential, random, mistakes, favorites, custom ranges, and mock exams, plus 10-question sessions and practice with generated variations.",
    "aws.f5": "Mock exams use the question counts and durations of the corresponding exams, such as 65 questions in 90 minutes for AIF-C01, 65 in 130 minutes for SAA-C03, and 75 in 180 minutes for professional-level exams. They include a timer, flags for later review, locally saved drafts, and automatic submission when time expires. After submission, review all questions or just mistakes.",
    "aws.f6": "Score estimates weight recent mock exams more heavily, multiplying each earlier exam’s weight by 0.7. An incomplete exam receives half of its answered fraction as its weight adjustment. Results show an estimated score, range, comparison with the passing threshold, trend, and confidence. Practice results are scaled to 100–1000 for study planning.",
    "aws.f7": "Incorrect answers are added automatically to a mistake review list for targeted practice. The home screen shows the bank size, questions practiced, accuracy, and mistake count.",
    "aws.f8": "Terms in questions, options, and explanations receive dotted underlines. Hover or click to see a definition, with a glossary for each interface language. Definitions are hidden during mock exams and return during review.",
    "aws.f9": "Copy a question into an AI chat with one click. The Markdown begins with a prompt describing how to answer, followed by the exam, bank language, question type, selected option, question, and choices. Answers and explanations are included after answering or during review, keeping them hidden when copying before an answer. Paste the text into an AI chat to continue studying.",
    "aws.f10": "A Chinese AIF-C01 revision handbook based on version 1.1 of the official exam guide. Its 13 chapters cover exam rules, translated service names, quick selection cues, concept diagrams, commonly confused concepts, elimination techniques, exam strategy, new topics, self-tests, memory cards, and a Chinese–English glossary. It is linked from the home screen.",
    "aws.f11": "Google sign-in and cross-device synchronization. Progress is saved to the cloud by account and merged across devices using the latest timestamp for each question. Access currently uses an allowlist for me and a few friends.",
    "aws.f12": "Install the app on a desktop or mobile home screen and practice offline with cached question banks. Other features include question navigation with status filters and text or number search, official exam score records with pass status on the home screen, and light and dark themes.",
    "aws.stack": "Single-page web app using HTML, CSS, and JavaScript, hosted on Cloudflare Pages. Pages Functions handle synchronization, Cloudflare Access uses Google as the identity provider, and KV stores progress. Python scripts parse and clean PDFs into question banks, with scripts checking structure and text quality.",
    "aws.shot.home": "Home: switch exams and languages in the top bar, see study progress and recorded exam passes, and install the web app. I used it to prepare for AIF-C01, which I passed in 2026.",
    "aws.shot.modes": "Practice modes: sequential, 10-question sessions, random, mistakes, favorites, custom ranges, and mock exams.",
    "aws.shot.question": "After answering: explanations for why each option is right or wrong, with Copy question and Question navigation at the top right.",
    "aws.shot.glossary": "Hover over an underlined term to open its definition.",
    "aws.shot.nav": "Question navigation: filter by correct, incorrect, unanswered, or favorited, and search by text or question number.",
    "aws.shot.mock": "Mock exam analysis: an estimated exam score and range weighted across the three latest mocks, comparison with the passing threshold, and recent results.",
    "aws.shot.result": "Mock exam results: question count, time taken, scaled score, and passing threshold. Review every question or only mistakes.",
    "aws.shot.guide": "Chinese AIF-C01 study guide: chapter navigation through material based on the official exam guide.",
    "aws.design": "Questions, glossary entries, and explanations share one interface, so I can compare languages while returning to the underlying concepts. Mock exams draw only from the original questions and hide definitions until review. Practice scores are scaled to 100–1000 as a study reference. Progress is saved locally first, with sign-in providing cross-device synchronization, so practice can continue offline.",
    "cal.locked": "Sign-in required · Single user",
    "cal.problem": "From September 2024 to May 2025, I went from about 100 kg to about 65 kg using a spreadsheet. I logged daily intake and weight changes, used them to estimate energy expenditure, then calculated a daily target and adjusted it as I observed the results. After losing the weight, I wanted to maintain it with less daily data entry. I turned the same calculations into an app for quicker logging, automatic targets, and progress updates.",
    "cal.f1": "Today: remaining calories, target, logged intake, latest weight, and a progress ring. Going over the target brings a simple reminder: keep going tomorrow.",
    "cal.f2": "Log a food with a click. Search a food database of about 200 items imported from the original spreadsheet, pin favorites and frequently used foods, or add custom foods.",
    "cal.f3": "Quick entries: reuse a recent food, or enter just calories and a note. Choose the day before yesterday, yesterday, today, tomorrow, or any other date.",
    "cal.f4": "Weight and backdated entries: each weight entry keeps its original Japan-time timestamp, with a separate selectable record date. Calorie, weight, and body measurement entries can be edited or deleted, with confirmation before deletion.",
    "cal.f5": "Daily archive: browse a month’s daily calories, days with records, average intake for recorded days, and the automatic target. Open a day to manage entries or add a weight record.",
    "cal.f6": "Trends: average intake, weight change, estimated expenditure, and daily target; a 30-day calorie chart with a target line; and a 60-day weight graph showing the averages of two time windows.",
    "cal.f7": "The daily target calculation is displayed on the page: ① average intake over 30 days + ② correction from weight averages in two windows = ③ estimated expenditure; ③ − ④ daily deficit derived from the monthly weight-loss goal = daily target. A footnote lists each window’s mean, measurement count, and energy coefficient.",
    "cal.f8": "The automatic target appears only when every day in the last 30 days has an intake record, both weight windows contain measurements, and the result is positive. Otherwise, the app shows recorded days, average intake, and missing dates. Missing days remain missing rather than being treated as zero calories.",
    "cal.f9": "Body measurements: record body fat percentage, waist, bust, underbust, hips, and thigh circumference. The app calculates the bust–underbust difference, reference cup and bra sizes commonly used in Japan, waist-to-hip and waist-to-height ratios, BMI, fat mass, and lean mass. Blank fields use the latest measured value, and size boundaries show two possible sizes.",
    "cal.f10": "Chinese and Japanese interfaces, with all day boundaries set to Asia/Tokyo. Export all records as CSV or create a JSON backup including the food database, favorites, and target settings. Sync status and manual refresh are also available.",
    "cal.stack": "Web app with data in Cloudflare D1 and dates grouped by Japan time. Separate tables store calorie, weight, and body measurement records, alongside a food database.",
    "cal.shot.today": "Today: remaining calories, target, logged intake, latest weight, and a progress ring. Food search and favorites sit on the right, with a quick-entry form below.",
    "cal.shot.daily": "Daily archive: a month’s calorie records, recorded-day count, daily average, and automatic target. Open a date to manage its entries.",
    "cal.shot.trend": "Trends: average intake, weight change, estimated expenditure, and daily target, with daily calorie bars and a 60-day weight graph.",
    "cal.shot.formula": "The target calculation is visible on the page: 30-day average intake plus a correction from two weight windows gives estimated expenditure, then the daily deficit derived from the monthly goal is subtracted.",
    "cal.shot.body": "Body measurements: measured values, automatically calculated differences, reference cup and bra sizes, and waist-to-hip ratio. Blank fields use the latest measurement.",
    "cal.design": "I kept the spreadsheet’s calculations and show all four steps on the page. When records are incomplete, the target displays a dash and the number of missing days, then appears once the data is complete. Logging takes fewer clicks through pinned foods and reusable recent entries. Dates default to today but remain editable, and Japan-time day boundaries preserve the chosen dates of backdated entries.",
    "ootd.locked": "Google sign-in required · Allowlisted accounts",
    "ootd.problem": "I owned more clothes than I could easily find, often bought items I barely wore, and struggled to build outfits around particular pieces. Shopping records and the wardrobe were separate, so purchases, storage locations, wear history, and combinations were hard to connect. I brought them into one record, from purchase imports through storage and daily wear to outfit combinations and cost per wear.",
    "ootd.f1": "Wardrobe catalog and search: each item has an ID such as TOP-0179, category, color, brand, photo, and tags. Search names, IDs, colors, brands, locations, or tags; filter by main group, category, location, or tag; show only unworn items; and browse in casual, newest-added, or recently-worn order.",
    "ootd.f2": "Today’s outfit: the home screen lists recently worn items and seasonal unworn items ordered by recent purchase. Select several and log them together. Each item counts once per day, even after repeated clicks. The wardrobe list and item page also have a one-click wear action.",
    "ootd.f3": "Storage locations: cabinet → shelf → compartment → inside/outside. Each compartment shows its item count and width × height × depth. Open it to see the items and placement suggestions, remove items, or assign locations in bulk. Planned and actual locations are stored separately.",
    "ootd.f4": "Item details: storage location and last confirmation time, total wears, cost per wear based on the paid price divided by distinct days worn, recent wear history, tags, and an action to build an outfit around the item. Cost per wear becomes available after the first wear.",
    "ootd.f5": "Outfit book: brand looks, saved inspiration, and my own combinations link to actual items, with wear counts and ratings. Each outfit has a retrieval list grouped by current storage location. Outfit and individual wear records are deduplicated automatically. Changing the pieces creates a new version and preserves the earlier one.",
    "ootd.f6": "Spending review: total spending, spending on unworn clothes, and the number of estimated amounts, grouped by month, year, brand, or category. Yen amounts are converted to Chinese yuan at a fixed rate. Records without a price contribute to item counts and are identified separately.",
    "ootd.f7": "Purchase imports: import clothing, shoes, bags, accessories, and makeup from my purchase record database. Price, currency, date, platform, order number, and product image are prefilled. Preview changes before importing; refunded lines are skipped.",
    "ootd.f8": "AI-assisted tagging: AI suggests style, season, and color tags, which I confirm before applying. Low-confidence suggestions are skipped, and manually assigned tags are preserved.",
    "ootd.f9": "Clothing and makeup share one catalog, with fields and tag dimensions shown according to the main group. Makeup has a deduplicated Used today action and can include application notes.",
    "ootd.f10": "Two ways to run it: a local version uses a Python standard-library HTTP server and SQLite, needs no extra dependencies, starts with one command, and can be backed up by copying its data folder. The cloud version runs on Cloudflare Workers in Python with Durable Object SQLite at ootd.yotenra.com, using an allowlist with Google sign-in. A read-only MCP interface also lets an AI assistant query the wardrobe to help plan outfits.",
    "ootd.stack": "Python standard-library HTTP server, SQLite, and a plain HTML, CSS, and JavaScript frontend with no build step. The cloud version uses Cloudflare Workers in Python and Durable Object SQLite, with Google sign-in.",
    "ootd.shot.wardrobe": "My wardrobe: search and filters, including tops and recently added items. Cards show storage location, style tags, and wear status.",
    "ootd.shot.today": "Today’s outfit: seasonal unworn items ordered by recent purchase. Select items and log them together, with each item counted once per day.",
    "ootd.shot.looks": "Outfit book: 33 outfits linked to items, wear counts, and ratings. Choose a look to see where each piece is stored.",
    "ootd.shot.places": "Storage locations: folded-clothing cabinets, hanging storage, and underwear storage show counts by compartment. Open a compartment to see its contents and dimensions or remove an item.",
    "ootd.shot.spending": "Spending review: total spending, unworn purchases, and estimated amounts, with views by month, year, brand, and category.",
    "ootd.shot.item": "Item details: location, total wears, cost per wear, recent wear history, tags, and an action to build an outfit around the item.",
    "ootd.design": "I organize the data around the next time I use an item. One wear per day keeps counts meaningful. Planned and actual storage locations stay separate, and placement is confirmed only when I mark an item as put away. Cost per wear appears when both price and wear records are available; otherwise, the app explains what is missing. Clothing and makeup share the same tag system. Candy-colored screens make daily logging feel light and easy.",

    "aws.problem": "AWS認定試験の勉強では、中国語、日本語、英語の資料を行き来していました。概念を理解するだけでなく、3言語の用語も覚える必要があります。正誤だけでなく、各選択肢の理由や合格ラインまでの距離を確認し、分からない問題はすぐAIに相談したいと考えました。そこで、自分用の学習アプリをつくり、受ける試験に合わせて問題集を追加しました。現在は7種類の試験に対応しています。",
    "aws.f1": "7種類のAWS認定試験（CLF-C02、SAA-C03、SAP-C02、AIF-C01、AIP-C01、DOP-C02、SCS-C03）に対応。画面上部で切り替え、試験ごとに進捗を保存します。",
    "aws.f2": "言語ごとに問題集を用意しています。多くは日中英の3言語、AIF-C01は中英の2言語です。問題番号と学習進捗は言語ごとに独立しています。",
    "aws.f3": "画面は日中英の3言語に対応。ブラウザーの言語が中国語なら中国語、日本語なら日本語、それ以外は英語を選びます。その試験に対応する言語の問題集がない場合は、画面と問題集をともに英語に切り替えます。前回の言語は試験ごとに記憶します。",
    "aws.f4": "順番、ランダム、間違えた問題、お気に入り、範囲指定、模試の各モードに加え、10問のミニ練習と派生問題の練習があります。",
    "aws.f5": "模試は実際の試験に合わせた問題数と時間で実施します（AIF-C01は65問・90分、SAA-C03は65問・130分、プロフェッショナルは75問・180分など）。残り時間の表示、見直し用のマーク、中断した模試の端末内保存と再開、時間切れ時の自動提出に対応。提出後は全問または間違えた問題だけを振り返れます。",
    "aws.f6": "最近の模試に高い重みを付け、過去にさかのぼるごとに0.7倍としてスコアを予測します。未完了の模試は回答済みの割合に応じて重みを半分にします。予測スコア、範囲、合格ラインとの比較、傾向、信頼度を表示。練習用の目安として100〜1000点に換算しています。",
    "aws.f7": "間違えた問題を自動で保存し、その問題だけを復習できます。ホームには問題数、回答済みの数、正答率、間違えた問題の数を表示します。",
    "aws.f8": "問題文、選択肢、解説の用語に点線の下線を付け、マウスを重ねるかタップすると説明を表示します。3つの画面言語にそれぞれ用語集があります。模試中は説明を隠し、提出後の振り返りで表示します。",
    "aws.f9": "現在の問題を、AIに質問しやすいMarkdown形式でコピーできます。AIへの回答指示に続けて、試験、問題集の言語、問題形式、現在の選択、問題文、選択肢を記載します。正解と解説は回答後・振り返り時にのみ含めるため、回答前には答えが出ません。AIの会話に貼り付けて、続けて学習できます。",
    "aws.f10": "AIF-C01には、公式試験ガイドv1.1に基づいた中国語の直前対策ガイドがあります。試験ルール、サービス名の訳、問題の手掛かりと選択肢の早見表、概念図、混同しやすい概念の比較、消去法、受験時の戦略、新しい出題項目、確認問題、暗記カード、中英の用語対照など、全13章で構成。ホームから開けます。",
    "aws.f11": "Googleでログインすると、学習進捗をアカウントごとにクラウドへ保存します。複数端末の記録は、問題ごとに新しいタイムスタンプを優先して統合します。許可リスト方式で、現在は本人と少数の友人が利用しています。",
    "aws.f12": "PCやスマートフォンのホーム画面にインストールでき、キャッシュ済みの問題集はオフラインでも利用できます。正解・不正解・未回答・お気に入りで絞り込む問題一覧、問題文・番号の検索、AWSのスコアレポートを入力する成績記録、合格状況の表示、ライト・ダークモードもあります。",
    "aws.stack": "HTML/CSS/JavaScriptのシングルページWebアプリ。Cloudflare Pagesで公開し、Pages Functionsを同期用のバックエンド、KVを進捗の保存に使用。Cloudflare AccessとGoogleの認証を利用しています。問題集はPythonスクリプトでPDFから解析・整理して生成し、構造とテキスト品質を検証しています。",
    "aws.shot.home": "ホーム：画面上部で試験と言語を切り替え、進捗、試験の合格記録、Webアプリのインストールを確認できます。このアプリを使って学習し、2026年にAIF-C01に合格しました。",
    "aws.shot.modes": "学習モード：順番、10問のミニ練習、ランダム、間違えた問題、お気に入り、範囲指定、模試。",
    "aws.shot.question": "回答後の解説：各選択肢の正誤の理由を確認できます。右上には問題のコピーと問題一覧へのボタンがあります。",
    "aws.shot.glossary": "下線のある用語にマウスを重ねると、説明を表示します。",
    "aws.shot.nav": "問題一覧：正解・不正解・未回答・お気に入りで絞り込み、問題文や番号で検索できます。",
    "aws.shot.mock": "模試の分析：直近3回を重み付けしてスコアと範囲を予測し、合格ラインや最近の成績と比較します。",
    "aws.shot.result": "模試の結果：問題数、所要時間、換算スコア、合格ラインを表示。間違えた問題だけ、または全問を振り返れます。",
    "aws.shot.guide": "AIF-C01の中国語学習ガイド：公式試験ガイドに基づいて作成し、章ごとに閲覧できます。",
    "aws.design": "問題集、用語集、解説を同じ画面にまとめ、言語を比べながら具体的な概念に戻れるようにしました。模試には元の問題を使い、受験中は用語解説を隠し、提出後に表示します。スコアは練習用の目安として100〜1000点に換算。進捗はまず端末に保存し、ログイン後は端末間で同期するため、オフラインでも学習を続けられます。",
    "cal.locked": "ログインが必要 · 個人用",
    "cal.problem": "2024年9月から2025年5月にかけて、体重を約100kgから約65kgまで減らしました。そのとき使っていたのは表計算です。毎日の摂取量と体重を記録し、その変化から消費量を推定して、減量目標に応じた1日の摂取量を計算し、様子を見ながら調整しました。減量後も記録を続けて体重を維持するため、同じ計算方法をアプリにしました。記録を手軽にし、目標を自動計算し、進み具合をすぐ確認できるようにしています。",
    "cal.f1": "「今日」では、残りの摂取量、目標、記録済みのカロリー、最新の体重、進捗リングを表示します。目標を超えた場合も「明日また続けましょう」と案内します。",
    "cal.f2": "元の表計算から取り込んだ約200種類の食品を検索し、お気に入りやよく使う食品を上部に表示できます。食品をタップして記録し、自分で食品を登録することもできます。",
    "cal.f3": "最近食べたものをワンタップで入力し、カロリーとメモだけで記録できます。おととい・昨日・今日・明日、または任意の日付を選べます。",
    "cal.f4": "体重の記録には日本時間のタイムスタンプを残し、記録日も別途指定できます。カロリー、体重、身体サイズの記録は編集・削除でき、削除時には確認を表示します。",
    "cal.f5": "月ごとに毎日のカロリー、記録のある日数、記録した日の平均、計算した目標を表示します。日付を開いて、その日の記録の編集や体重の追加ができます。",
    "cal.f6": "平均摂取量、体重変化、推定消費量、1日の目標を表示。30日分の摂取カロリーの棒グラフには目標線を、60日分の体重の折れ線グラフには2期間の平均を示します。",
    "cal.f7": "目標の計算方法を画面に表示しています。① 直近30日の平均摂取量 ＋ ② 2期間の体重による補正 ＝ ③ 推定消費量。③ − ④ 月間減量目標を1日当たりに換算したエネルギー不足量 ＝ 1日の摂取目標。脚注には2期間の平均・記録数とエネルギー係数を記載しています。",
    "cal.f8": "直近30日すべてに摂取記録があり、2つの体重集計期間に測定値があり、計算結果が正の場合に、目標を表示します。不足がある場合は記録日数、記録した日の平均、不足している日を表示。記録のない日は欠測として扱います。",
    "cal.f9": "体脂肪率、ウエスト、トップ・アンダーバスト、ヒップ、脚の周囲を記録します。バスト差、参考カップと日本で一般的な参考サイズ、ウエスト・ヒップ比、ウエスト・身長比、BMI、脂肪量、除脂肪体重を自動計算。未入力の項目は直近の実測値を使い、サイズの境界では2つの候補を示します。",
    "cal.f10": "画面は日中2言語に対応。日付の区切りはすべて日本時間（Asia/Tokyo）です。全記録のCSV出力や、食品データ、お気に入り、目標設定を含むJSONバックアップ、同期状態の表示、手動更新に対応しています。",
    "cal.stack": "Webアプリで、クラウドデータベースのCloudflare D1に保存します。日付はすべて日本時間で区切り、カロリー、体重、身体サイズの3種類の記録と食品データを管理しています。",
    "cal.shot.today": "今日：残りの摂取量、目標、記録済みのカロリー、最新の体重、進捗リングを表示。右側には食品検索とお気に入り、下には簡単入力があります。",
    "cal.shot.daily": "日別の記録：月ごとの摂取カロリー、記録日数、平均、計算した目標を表示。日付を開いて記録を編集できます。",
    "cal.shot.trend": "推移：平均摂取量、体重変化、推定消費量、1日の目標と、日別カロリーの棒グラフ、60日分の体重グラフを表示します。",
    "cal.shot.formula": "計算方法：30日の平均摂取量に2期間の体重による補正を加えて消費量を推定し、月間減量目標を1日当たりに換算したエネルギー不足量を引きます。",
    "cal.shot.body": "身体サイズ：実測値からバスト差、参考カップとサイズ、ウエスト・ヒップ比などを計算します。未入力の項目には直近の実測値を使います。",
    "cal.design": "表計算で使っていた方法を引き継ぎ、目標を求める4段階の計算を画面に示しました。データが足りないときは「—」と不足日数を表示し、記録がそろってから目標を出します。よく使う食品の固定表示や最近の記録の再利用で、入力の操作を減らしました。日付は今日を初期値にし、いつでも変更できます。日本時間で日付を区切り、過去の日付で追加した記録も、その日付を保持します。",
    "ootd.locked": "Googleログインが必要 · 許可リスト方式",
    "ootd.problem": "服が多くて見つからない、買っても数回しか着ない、着たい服の組み合わせが思い付かない。購入履歴とクローゼットが別々で、買ったもの、収納場所、着用回数、コーディネートをつなげて見られませんでした。そこで、購入履歴の取り込みから、収納場所、毎日の着用、コーディネート、1回当たりの費用まで、一つの記録にまとめました。",
    "ootd.f1": "各アイテムに番号（TOP-0179など）、分類、色、ブランド、写真、タグを登録します。名前、番号、色、ブランド、場所、タグで検索し、大分類・分類・場所・タグ・未着用で絞り込めます。ランダム、追加順、最近着た順に並べ替えられます。",
    "ootd.f2": "ホームには最近着たものと、今の季節でまだ着ていないものを最近の購入順に表示します。複数選んでまとめて記録でき、同じアイテムは1日1回だけ数えます。衣服の一覧や詳細画面からも、その日の着用を記録できます。",
    "ootd.f3": "収納を、棚・クローゼット → 段 → 区画 → 内側・外側で管理します。区画ごとに点数と幅・高さ・奥行きを表示し、中のアイテムや置き方の提案を確認できます。取り出しや場所の一括設定に対応し、予定の場所と実際の場所を別々に記録します。",
    "ootd.f4": "アイテムの詳細では、収納場所と最終確認日時、着用回数、1回当たりの費用（購入額 ÷ 着用日数）、最近の着用、タグを確認できます。1回着用すると費用を計算でき、そのアイテムを使ったコーディネートも開けます。",
    "ootd.f5": "公式の組み合わせ、保存した組み合わせ、自分でつくった組み合わせを管理します。手持ちのアイテムと結び付け、着用回数と評価を表示。開くと収納場所ごとの取り出しリストが見られます。セットの着用と単品の着用は重複を除き、構成を変えた場合は新しい版として保存して、以前の版も残します。",
    "ootd.f6": "購入額の合計、未着用の服の金額、推定金額を使った記録数を確認できます。月・年・ブランド・分類別に集計し、円は固定レートで人民元に換算します。金額がない記録は点数のみを数え、別途表示します。",
    "ootd.f7": "自分で管理している購入履歴から、衣服、靴・バッグ・アクセサリー、コスメを取り込みます。購入額、通貨、日付、購入先、注文番号、商品画像を事前入力し、プレビュー後に取り込みます。返金済みの行は除外します。",
    "ootd.f8": "AIがスタイル、季節、配色などのタグ候補を出し、私が確認してから反映します。確信度の低い候補は適用せず、人が付けたタグは保持します。",
    "ootd.f9": "衣服とコスメを同じ仕組みで管理し、大分類に応じて項目とタグを表示します。コスメもその日の使用を記録し、重複を除きます。使い方のメモも付けられます。",
    "ootd.f10": "ローカル版はPython標準ライブラリのHTTPサーバーとSQLiteで動き、追加ライブラリなしで起動できます。データフォルダー全体のコピーでバックアップできます。クラウド版はCloudflare Workers（Python）とDurable Object SQLiteで運用し、ootd.yotenra.comでGoogleログインの許可リストを使用。読み取り専用のMCPインターフェースから、AIアシスタントが衣服を検索してコーディネートを提案することもできます。",
    "ootd.stack": "Python標準ライブラリのHTTPサーバーとSQLite、HTML/CSS/JavaScriptの画面で構成。ビルドは不要です。クラウド版はCloudflare Workers（Python）とDurable Object SQLiteを使用し、Googleでログインします。",
    "ootd.shot.wardrobe": "衣服の一覧：検索や絞り込み、追加順での表示ができます。カードには収納場所、スタイルのタグ、着用状況を表示します。",
    "ootd.shot.today": "今日着たもの：今の季節でまだ着ていないアイテムを購入順に表示し、選択してまとめて記録できます。同じアイテムは1日1回だけ数えます。",
    "ootd.shot.looks": "コーディネート：33組を登録。手持ちのアイテム、着用回数、評価と結び付け、各アイテムの収納場所も確認できます。",
    "ootd.shot.places": "収納場所：畳んで収納する棚、ハンガー収納、肌着の収納などを区画ごとに表示します。中のアイテムや寸法を確認し、取り出しを記録できます。",
    "ootd.shot.spending": "購入の振り返り：合計、未着用の金額、推定額を使った部分を表示。月・年・ブランド・分類別に集計できます。",
    "ootd.shot.item": "アイテムの詳細：収納場所、着用回数、1回当たりの費用、最近の着用、タグ、そのアイテムを使ったコーディネートを表示します。",
    "ootd.design": "次に使うときに役立つよう、情報をつなげました。着用回数は1日1回だけ数え、予定の収納場所と実際の場所を分けて、収納を確認してから反映します。1回当たりの費用は購入額と着用記録があるときに計算し、足りない場合は理由を表示します。衣服とコスメには共通のタグを使っています。画面は明るい色でまとめ、毎日の記録を気軽に続けられるようにしました。",
