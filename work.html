let currentWorkLanguage, currentWorkText;
const workCases = ['baseconnect', 'holly', 'studio'];
function chosenCase() {
  const url = new URL(location);
  const legacy = url.hash.slice(1);
  if (['holly', 'studio'].includes(legacy)) {
    url.searchParams.set('case', legacy); url.hash = '';
    history.replaceState(null, '', url);
  }
  const selected = url.searchParams.get('case');
  return workCases.includes(selected) ? selected : 'baseconnect';
}
function render(lang, t) {
  currentWorkLanguage = lang; currentWorkText = t;
  const selected = chosenCase();
  document.querySelector('.work-tabs').setAttribute('aria-label', t['page.title']);
  document.querySelector('.page-note').hidden = selected !== 'baseconnect';
  workCases.forEach(id => {
    document.getElementById(id).hidden = id !== selected;
    const tab = document.getElementById('tab-' + id);
    tab.setAttribute('aria-selected', String(id === selected));
    tab.tabIndex = id === selected ? 0 : -1;
  });
  ['holly', 'studio'].forEach(id => {
    document.getElementById(id).innerHTML = `<header class="case-head"><h2 id="${id}-summary" data-rail-key="chapter.summary">${t[id + '.title']}</h2><p class="case-role">${t[id + '.role']}</p></header><div class="case-copy">${t[id + '.body']}</div>`;
  });
  document.getElementById('jobs').innerHTML = JOBS.map(j => `
    <section class="job" id="work-${j.id}" data-rail-icon="work" style="--tint:${j.tint};--tone:${j.tone};--paper:${j.paper}">
      <div class="job-head">
        <span class="app-badge" aria-hidden="true">${j.mark}</span>
        <div><h2 data-rail-key="chapter.${j.id}">${t[j.id + '.title']}</h2><p class="step">${t[j.id + '.sub']}</p></div>
      </div>
      <div class="job-body">
        <p>${t[j.id + '.desc']}</p>
        <div class="ui">${j.figure(t)}</div>
      </div>
    </section>`).join('');
}

function chooseWorkCase(id) {
  const url = new URL(location); url.searchParams.set('case', id); url.hash = '';
  history.pushState(null, '', url);
  render(currentWorkLanguage, currentWorkText);
  SiteNavigation.mount(currentWorkLanguage);
  scrollTo({top: 0, behavior: 'instant'});
}
document.querySelector('.work-tabs').addEventListener('click', event => {
  const tab = event.target.closest('[data-case]');
  if (tab) chooseWorkCase(tab.dataset.case);
});
document.querySelector('.work-tabs').addEventListener('keydown', event => {
  const index = workCases.indexOf(event.target.dataset.case);
  if (index < 0 || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  const next = event.key === 'Home' ? 0 : event.key === 'End' ? workCases.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + workCases.length) % workCases.length;
  chooseWorkCase(workCases[next]); document.getElementById('tab-' + workCases[next]).focus({preventScroll: true});
});
window.addEventListener('popstate', () => {
  render(currentWorkLanguage, currentWorkText); SiteNavigation.mount(currentWorkLanguage);
});

    "studio.body": "<section class=\"case-part\" id=\"studio-context\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">玩家的问题</h3><p>玩韩服游戏的中文玩家，不只需要支付协助，也会遇到语言不通、活动规则复杂、花了钱却不知道怎么用更合适的问题。</p></section><section class=\"case-part\" id=\"studio-service\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">实际提供的服务</h3><p>攻略帮助玩家弄清规则与消费方案；付费服务包括韩元代付与游戏内购、游戏内交易担保（按交易收取手续费），以及面向新玩家的按分钟计费咨询。我作为工作室创办者负责这些服务的设计与运营，并安排实习生参与交付。2,000+ 去重客户涵盖这些服务。</p></section><section class=\"case-part\" id=\"studio-approach\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">计算并推荐具体方案</h3><p>我把版本和活动规则整理成中文，用数学期望、投入产出比较道具产出、购买组合和使用路径，给出玩家能够直接照着执行的方案。</p><p>例如，整理礼包的购买等级与重叠区间，比较同一预算直接买金币和组合购买礼包的差别，或把技能效果与抽取、升级成本放在一起分析。重点是说明怎样获得所需的游戏内效果、需要多少投入、推荐先做哪一步。</p></section><section class=\"case-part\" id=\"studio-delivery\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">交付与持续服务</h3><p>我参与攻略图片、PDF、文字和视频制作，经营期间也搭建了攻略网站。把整理好的信息群发给订阅攻略更新的用户，并提供咨询、游戏相关交易、支付协助与后续服务。随着服务增加，整理客服步骤、分工和任务跟进，高峰期聘用约3名实习生。</p></section><section class=\"case-part\" id=\"studio-guides\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">参考资料</h3><p>原图为经营期间使用的玩家攻略样本；图中价值对应当时游戏内道具和价格。</p><div class=\"guide-gallery\"><figure class=\"guide-card\" id=\"studio-guide-1\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-01-58502708.jpg\" target=\"_blank\" rel=\"noopener\">成长礼包：购买等级与领取路径。 <span aria-hidden=\"true\">↗</span></a></h4><p>把可购买等级、重叠区间和奖励领取顺序画在一起，让玩家知道什么阶段能买、怎样安排。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-01-58502708.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"成长礼包：购买等级与领取路径。\"><img src=\"assets/guides/guide-01-58502708.jpg\" alt=\"成长礼包：购买等级与领取路径。\" width=\"1251\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-2\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-02-40fb69df.jpg\" target=\"_blank\" rel=\"noopener\">保底奖池：道具价值与抽取成本。 <span aria-hidden=\"true\">↗</span></a></h4><p>将当时的游戏内道具估值与抽取成本对照，解释方案的投入与产出。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-02-40fb69df.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"保底奖池：道具价值与抽取成本。\"><img src=\"assets/guides/guide-02-40fb69df.jpg\" alt=\"保底奖池：道具价值与抽取成本。\" width=\"1009\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-3\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-03-e98b9a19.jpg\" target=\"_blank\" rel=\"noopener\">同一预算：直接买金币还是组合购买。 <span aria-hidden=\"true\">↗</span></a></h4><p>比较不同购买与抽取路径，给出具体的组合和执行建议。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-03-e98b9a19.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"同一预算：直接买金币还是组合购买。\"><img src=\"assets/guides/guide-03-e98b9a19.jpg\" alt=\"同一预算：直接买金币还是组合购买。\" width=\"963\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-4\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-04-6fd97c62.jpg\" target=\"_blank\" rel=\"noopener\">通用核心：技能效果与升级成本。 <span aria-hidden=\"true\">↗</span></a></h4><p>将属性、抽取和升级需要的投入放在一起，帮助规划游戏内资源。原件是当时查看PDF的手机截图。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-04-6fd97c62.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"通用核心：技能效果与升级成本。\"><img src=\"assets/guides/guide-04-6fd97c62.jpg\" alt=\"通用核心：技能效果与升级成本。\" width=\"589\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure></div></section><section class=\"case-part\" id=\"studio-results\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">经营与内容规模</h3><ul class=\"case-facts\"><li>平台累计播放量约50万。</li><li>累计服务2,000+去重客户。</li><li>累计客户收款约人民币1,500万元，包含用于执行代付的款项。</li><li>累计毛利超过人民币300万元，已扣礼品卡／充值执行成本，未扣人员和其他经营开支。</li><li>累计净利润约人民币250万元（估算）。</li></ul></section>",

    "baseconnect.lead": "As an intern at Baseconnect, I work on company data extraction and quality: structuring information from websites and PDFs, investigating missing or incorrect results, improving the production pipeline, and checking whether changes work. Over three months, I authored 190 PRs that were merged. During this work, accuracy for one data field rose from over 40% to 85%, and its coverage rose from over 30% to 75%.",
    "holly.title": "Helping hotel sales staff adjust pricing strategies",
    "holly.role": "<strong>Holly Travel | Dec 2017 – Dec 2021</strong>   <strong>Assistant to the CEO (Business Systems &amp; Development Coordination)</strong>",
    "holly.body": "<section class=\"case-part\" id=\"holly-context\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">How the system worked</h3><p>Holly Travel operated a B2B hotel booking and distribution business. Its business system connected upstream hotels and suppliers with downstream distribution channels, handling room availability, inventory and prices. Sales staff needed to adjust prices for rooms and room nights available for sale as market conditions changed, with the aim of improving returns on that inventory.</p><p>The system used APIs to connect suppliers and distribution channels, let staff adjust pricing rules, and automated their execution.</p></section><section class=\"case-part\" id=\"holly-role\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">My role</h3><p>At Holly Travel, I directly supported the CEO and coordinated business requirements with approximately 5–10 developers. My work focused on translating day-to-day business needs into workable system designs and keeping implementation moving.</p><p>For hotel inventory pricing, I observed how sales staff set prices, gathered their requirements, and discussed technical feasibility and implementation difficulty with developers. I communicated the achievable scope back to sales staff. I brought the two sides together around a UI proposal that business staff could use and developers could deliver, then created a demo and wrote the requirements documents.</p></section><section class=\"case-part\" id=\"holly-tradeoff\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">A trade-off: match invoices, then review before importing</h3><p>Finance wanted a fully automated workflow for importing hotel invoice information into the internal accounts-payable system. Considering cost, delivery time and accuracy, I chose preliminary matching followed by finance review before import. This workflow is now live, keeping human judgment in the process and delivering a workable solution.</p></section><section class=\"case-part\" id=\"holly-approach\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">How I work</h3><ul class=\"case-facts\"><li>Planned and tracked delivery with Gantt charts, dependencies, effort, costs, and staff availability.</li><li>Clarified blockers and compared alternative implementations that could achieve the same business goal.</li><li>Contributed requirements for distribution systems serving online travel platforms and offline travel agencies, as well as internal finance, accounting, and performance-based bonus calculation systems.</li></ul><p>I also supported hiring assessments and interviews.</p></section>",
    "studio.title": "Guides and services for Chinese-speaking MapleStory M players",
    "studio.role": "<strong>Studio Keya_cc | Nov 2019 – Dec 2025</strong>   <strong>Founder</strong>",
    "studio.body": "<section class=\"case-part\" id=\"studio-context\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">Role &amp; duties</h3><p>The content explained game versions and events for Chinese-speaking players on Korean servers who faced a language barrier.</p></section><section class=\"case-part\" id=\"studio-service\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">What the service provided</h3><p>The guides helped players understand game rules and spending options. Paid services included making payments in Korean won and handling in-game purchases for players, escrow for in-game trades with a fee per transaction, and consultations for new players billed by the minute. As founder, I designed and ran these services, with interns supporting delivery. Across these services, there were more than 2,000 unique customers.</p></section><section class=\"case-part\" id=\"studio-approach\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">How I work</h3><p>I used expected-value calculations and comparisons of item costs and outputs to recommend concrete participation and spending plans, including how to combine purchases and draws within a given budget.</p></section><section class=\"case-part\" id=\"studio-delivery\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">Workflow</h3><p>I contributed to Chinese-language guide graphics and built a guide website during the studio’s operation.</p><p>I delivered this guidance to subscribers through PDFs, structured written notes, and videos shared in group and bulk messages. These materials helped explain each update and set out recommended next steps, alongside the studio’s payment assistance, transaction handling, and game support. My role connected the analysis behind a recommendation with the practical work of keeping customers informed and delivering the service.</p></section><section class=\"case-part\" id=\"studio-guides\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">References</h3><div class=\"guide-gallery\"><figure class=\"guide-card\" id=\"studio-guide-1\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-01-58502708.jpg\" target=\"_blank\" rel=\"noopener\">Growth gem bundles: eligibility and reward claims <span aria-hidden=\"true\">↗</span></a></h4><p>For Chinese-speaking players on Korean game servers, this historical guide organized growth gem bundle rules by purchase level, explained overlapping eligibility ranges, and set out the reward-claiming sequence. It turned the eligibility rules into a practical route for identifying and claiming the applicable rewards.</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-01-58502708.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"Growth gem bundles: eligibility and reward claims\"><img src=\"assets/guides/guide-01-58502708.jpg\" alt=\"Growth gem bundles: eligibility and reward claims\" width=\"1251\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-2\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-02-40fb69df.jpg\" target=\"_blank\" rel=\"noopener\">Guaranteed-reward draws: item value and cost <span aria-hidden=\"true\">↗</span></a></h4><p>This historical Chinese-language guide compared the in-game item values used at the time with the cost of drawing from a guaranteed-reward pool. For players deciding how to spend, it brought the rewards and costs together in a concrete recommended plan.</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-02-40fb69df.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"Guaranteed-reward draws: item value and cost\"><img src=\"assets/guides/guide-02-40fb69df.jpg\" alt=\"Guaranteed-reward draws: item value and cost\" width=\"1009\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-3\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-03-e98b9a19.jpg\" target=\"_blank\" rel=\"noopener\">Comparing options within the same budget <span aria-hidden=\"true\">↗</span></a></h4><p>For Chinese-speaking players considering a purchase, this guide compared buying game currency directly with combinations of bundles and draws under the same budget. Using the item values and costs recorded at the time, it made the trade-offs visible and supported a concrete spending recommendation.</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-03-e98b9a19.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"Comparing options within the same budget\"><img src=\"assets/guides/guide-03-e98b9a19.jpg\" alt=\"Comparing options within the same budget\" width=\"963\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-4\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-04-6fd97c62.jpg\" target=\"_blank\" rel=\"noopener\">General skill cores: effects and upgrade costs <span aria-hidden=\"true\">↗</span></a></h4><p>This historical guide explained general skill-core effects and compared upgrading and drawing costs for Chinese-speaking players on Korean servers. It brought the effects and costs into one reference to support a practical upgrade and draw plan.</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-04-6fd97c62.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"General skill cores: effects and upgrade costs\"><img src=\"assets/guides/guide-04-6fd97c62.jpg\" alt=\"General skill cores: effects and upgrade costs\" width=\"589\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure></div></section><section class=\"case-part\" id=\"studio-results\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">Results</h3><ul class=\"case-facts\"><li>The videos reached approximately 500,000 cumulative video views, and the business served more than 2,000 unique customers.</li><li>Handled approximately CNY 15 million in cumulative customer payments, including funds used for top-ups.</li><li>Generated more than CNY 3 million in gross profit after gift-card and top-up fulfilment costs, before wages and other operating costs; estimated net profit was approximately CNY 2.5 million.</li><li>Peak staffing included approximately three interns.</li></ul></section>",

    "method.title": "AIを使った仕事の進め方",
    "method.body": "Claudeを開発に使い、作業を9段階に整理しています。私が課題と目標を定める → AIに調査を依頼する → 私が調査結果の妥当性を判断する → AIにコード案を依頼する → 私が違和感のある点やリスクの高い箇所を確認する → 修正してPRを作成する → 受け入れ基準を.mdに記載する → マージ後に基準に沿って検証する → 結果をPRのコメントに残す。前の議論に参加していないエージェントにも反例の検討やレビューを依頼します。課題を具体化し、方針を判断し、結果が業務の要件を満たすか確かめることを重視しています。",

    "lead.card": "このページでは仕事の進め方を紹介しています。データ修正を、継続して改善できるパイプラインにした経験は、別のページにまとめました。",

    "baseconnect.lead": "Baseconnectのインターンで、企業データの抽出と品質改善に取り組んでいます。WebページやPDFから企業情報を構造化する過程を調べ、抽出漏れや誤抽出、データの誤りが生じる原因を特定。データ生成パイプラインを修正し、その効果を検証しています。3か月で190件のPRを作成し、マージまで進めました。取り組みの中で、特定のデータ項目の精度は40％台から85％に、データカバー率は30％台から75％に改善しました。",
    "holly.title": "販売担当者が価格戦略を調整できるホテル在庫・料金管理システム",
    "holly.role": "<strong>Holly Travel（和旅）｜2017年12月〜2021年12月｜CEOアシスタント（業務改善・開発調整担当）</strong>",
    "holly.body": "<section class=\"case-part\" id=\"holly-context\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">どのようなシステムか</h3><p>Holly Travelは、B2Bのホテル予約・販売事業を行っていました。システムはホテルや仕入先と連携し、販売先のチャネルに客室情報、在庫、料金を提供するものです。</p><p>販売担当者は、販売対象の客室や宿泊日ごとの在庫について、市場の状況に合わせて料金を調整します。このシステムは、その判断を日々の販売に反映し、在庫から得られる収益を高めることを目指したものでした。</p><p>対象システムは、インターフェースを通じて仕入先と販売チャネルをつなぎ、料金調整ルールの設定画面と自動料金調整機能を提供。販売チャネルには、オンライン旅行プラットフォームや実店舗を持つ旅行代理店が含まれます。</p></section><section class=\"case-part\" id=\"holly-role\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">私が担当したこと</h3><p>Holly Travel（和旅）では、CEO直属のアシスタントとして業務要件の整理と開発推進を担当しました。ホテルの客室・宿泊日ごとの在庫を対象とした料金調整では、業務担当者の実際の操作を観察し、必要な機能を整理。約5〜10名の開発メンバーと実現可能性や難易度を確認し、業務側にも対応できる範囲を説明しました。双方と調整しながら、現場で使いやすく、開発上も実現可能な画面案をまとめ、デモと要件文書を作成。</p></section><section class=\"case-part\" id=\"holly-tradeoff\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">判断の例：請求書を照合し、確認してから取り込む</h3><p>経理から、ホテルの請求書情報を社内システムの買掛金情報に全自動で取り込みたいという要望がありました。費用・納期・精度を踏まえ、まず情報を照合し、経理担当者が確認してから取り込む方式にしました。この仕組みは本番導入され、人の判断が必要な工程を残しながら、実現可能な範囲で要望に応えました。</p></section><section class=\"case-part\" id=\"holly-approach\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">どのように進めたか</h3><p>ガントチャートに加え、タスクの依存関係、工数・コスト、担当者の稼働可能時間を確認しながら進捗を管理しました。進行を妨げる課題を整理し、同じ業務目的を満たす代替案も比較して、開発を進めました。</p><p>旅行商品の販売・流通システム、社内の財務管理および評価に基づく賞与計算システムの要件整理にも参加しました。</p><p>採用時の評価基準の整理や面接にも関わりました。</p></section>",
    "studio.title": "攻略とサービスで、中国語圏のプレイヤーを支える",
    "studio.role": "<strong>Studio Keya_cc｜2019年11月〜2025年12月｜事業の立ち上げ・運営</strong>",
    "studio.body": "<section class=\"case-part\" id=\"studio-context\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">業務と役割</h3><p>韓国語の情報を読めない中国語圏のプレイヤーに向け、アップデートごとのイベント内容、参加方法、予算の使い方を中国語で整理しました。</p></section><section class=\"case-part\" id=\"studio-service\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">提供していたサービス</h3><p>攻略情報は、ゲームのルールや課金の選択肢を理解するために提供していました。有料サービスは、韓国ウォンでの支払い代行とゲーム内購入の代行、ゲーム内取引の代金を一時的に預かる保証サービス（取引ごとの手数料制）、新規プレイヤー向けの分単位で料金を設定した相談です。創業者としてサービスの設計・運営を担い、インターンにも提供業務を分担してもらいました。これらのサービス全体で、重複を除いた顧客数は2,000人以上です。</p></section><section class=\"case-part\" id=\"studio-approach\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">仕事の進め方</h3><p>アイテムの獲得量や投入した費用に対する効果を期待値などで計算し、ゲームのルール、必要な支出、得られる効果を結びつけて、おすすめの購入・利用手順を提示。同じゲーム内効果を得るために必要な支出を抑えることを軸に、利用者が実行できる攻略案にまとめました。</p></section><section class=\"case-part\" id=\"studio-delivery\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">仕事の流れ</h3><p>攻略画像の制作にも参加し、当時は攻略サイトも制作しました。攻略情報を受け取るユーザーには、PDF、整理した文章、動画を一斉配信し、イベントの理解から具体的な行動につながる情報を届けました。</p></section><section class=\"case-part\" id=\"studio-guides\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">参考資料</h3><p>図中の「価値」は、当時のゲーム内アイテムを比較するための評価額です。</p><div class=\"guide-gallery\"><figure class=\"guide-card\" id=\"studio-guide-1\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-01-58502708.jpg\" target=\"_blank\" rel=\"noopener\">ダイヤ成長パック：購入レベルと受け取り方 <span aria-hidden=\"true\">↗</span></a></h4><p>成長パックの使い方を知りたい中国語圏のプレイヤー向けに、購入レベル、複数パックの対象レベルが重なる区間、報酬の受け取り手順を図解。条件と受け取り方をまとめ、購入・受け取りの進め方を示しました。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-01-58502708.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"ダイヤ成長パック：購入レベルと受け取り方\"><img src=\"assets/guides/guide-01-58502708.jpg\" alt=\"ダイヤ成長パック：購入レベルと受け取り方\" width=\"1251\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-2\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-02-40fb69df.jpg\" target=\"_blank\" rel=\"noopener\">獲得保証付きの抽選：アイテム価値と購入費の比較 <span aria-hidden=\"true\">↗</span></a></h4><p>抽選を利用するか検討する中国語圏のプレイヤー向けに、排出アイテムのゲーム内での価値と購入費用を比較。当時のゲーム内アイテムの評価額を基準に、得られる内容と費用の釣り合いを示しました。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-02-40fb69df.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"獲得保証付きの抽選：アイテム価値と購入費の比較\"><img src=\"assets/guides/guide-02-40fb69df.jpg\" alt=\"獲得保証付きの抽選：アイテム価値と購入費の比較\" width=\"1009\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-3\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-03-e98b9a19.jpg\" target=\"_blank\" rel=\"noopener\">同じ予算で得られるコイン量の比較 <span aria-hidden=\"true\">↗</span></a></h4><p>コインを効率よく入手したい中国語圏のプレイヤー向けに、直接購入する場合と、パックや抽選を組み合わせる場合を同じ予算で比較。得られるコイン量と必要な費用を整理し、おすすめの購入順序・組み合わせを示しました。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-03-e98b9a19.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"同じ予算で得られるコイン量の比較\"><img src=\"assets/guides/guide-03-e98b9a19.jpg\" alt=\"同じ予算で得られるコイン量の比較\" width=\"963\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure><figure class=\"guide-card\" id=\"studio-guide-4\"><figcaption><h4><a class=\"guide-original\" href=\"assets/guides/guide-04-6fd97c62.jpg\" target=\"_blank\" rel=\"noopener\">共通コアスキルの効果と強化・抽選コスト <span aria-hidden=\"true\">↗</span></a></h4><p>スキル強化を考える中国語圏のプレイヤー向けに、共通コアスキルの性能と、強化・抽選に必要な費用を整理。得られる効果と費用を結びつけ、予算の使い方を提案しました。</p></figcaption><a class=\"guide-image-link\" href=\"assets/guides/guide-04-6fd97c62.jpg\" target=\"_blank\" rel=\"noopener\" aria-label=\"共通コアスキルの効果と強化・抽選コスト\"><img src=\"assets/guides/guide-04-6fd97c62.jpg\" alt=\"共通コアスキルの効果と強化・抽選コスト\" width=\"589\" height=\"1280\" loading=\"lazy\" decoding=\"async\"></a></figure></div></section><section class=\"case-part\" id=\"studio-results\"><h3 data-rail-label=\"\" data-rail-icon=\"work\">成果</h3><ul class=\"case-facts\"><li>顧客からの累計受取額： 約1,500万元（人民元、支払い代行分の元金を含む）。</li><li>累計粗利益： 300万元（人民元）超。ギフトカード購入費・チャージの実行原価を控除した金額で、人件費やその他の運営費の控除前です。</li><li>累計純利益： 約250万元（人民元、推定）。</li><li>動画の累計再生数は約50万回。</li><li>顧客数： 累計2,000名以上（重複を除く）。</li><li>運営にはピーク時に約3名のインターンが参加しました。</li></ul></section>",
