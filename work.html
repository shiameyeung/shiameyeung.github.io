// 四つの仕事。右の図は画面写真ではなく HTML で組む：文字は t から引くので言語と一緒に変わる。
const JOBS = [
  { id:'m1', mark:'⛏', tint:'#e8f0e8', tone:'#4f7a58', paper:'#fafcfa',
    figure: t => `<div class="flow">

  { id:'m2', mark:'📏', tint:'#eceaf4', tone:'#5d5789', paper:'#fbfafd',
    figure: t => `<div class="ui-bar"><span class="ui-title">${t['m2.d.title']}</span></div>
      <div class="ui-bars">
        <div class="ui-barline"><span>${t['m2.d.before']}</span><span class="ui-track"><i class="ui-fill" style="width:52%"></i></span></div>
        <div class="ui-barline"><span>${t['m2.d.after']}</span><span class="ui-track"><i class="ui-fill" style="width:84%"></i></span></div>

  { id:'m3', mark:'⚖️', tint:'#f6ece2', tone:'#9a6435', paper:'#fdfaf7',

      <div class="ui-opt right">${t['m3.d.rule']}</div>
      <div class="ui-note">${t['m3.d.else']}</div>
      <div class="ui-opt">${t['m3.d.model']}</div>
      <div class="ui-opt">${t['m3.d.guard']}</div>` },

  { id:'m4', mark:'🧹', tint:'#f9e9ec', tone:'#a1526a', paper:'#fefafb',
    figure: t => `<div class="ui-bar"><span class="ui-title">${t['m4.d.title']}</span></div>
      <div class="layers">
        <div class="layer"><b>1</b><span>${t['m4.d.l1']}</span></div>
        <div class="layer"><b>2</b><span>${t['m4.d.l2']}</span></div>
        <div class="layer"><b>3</b><span>${t['m4.d.l3']}</span></div>
      </div>
      <div class="ui-note">${t['m4.d.note']}</div>` },
];

function render(lang, t) {
  document.getElementById('jobs').innerHTML = JOBS.map(j => `
    <section class="job" style="--tint:${j.tint};--tone:${j.tone};--paper:${j.paper}">
      <div class="job-head">
        <span class="app-badge" aria-hidden="true">${j.mark}</span>
        <div><h2>${t[j.id + '.title']}</h2><p class="step">${t[j.id + '.sub']}</p></div>
      </div>
      <div class="job-body">
        <p>${t[j.id + '.desc']}</p>
        <div class="ui">${j.figure(t)}</div>
      </div>
    </section>`).join('');
}
