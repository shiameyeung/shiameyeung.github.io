    "s1.title": "公司做什么，我做什么",

    "s3.p2": "这样做的原因很具体：如果基准不先固定，验证就容易变成「看起来没问题」；如果记录散在各个对话里，下一次要从头解释前情。有了这些记录，审查者可以直接核对依据，新会话也能接着推进。",

    "s4.p1": "在旅行公司整理业务需求、和研发排期跟进测试，以及运营自己的工作室时把反复发生的处理写成手顺、分工给客服——这些经验让我习惯把工作拆成可跟进的单位。实习里我把一张任务票拆成「任务 → 处理批次 → 阶段事件」：每个活动中的批次都写明下一步、负责人、关联 PR 和材料路径；代码合并、dry-run、生产执行、后检是不同阶段，不用一个「完成」概括。",
    "s4.p2": "对数据对象也一样：用稳定的业务键把同一个对象在不同批次的结果串起来，比较之前先确认数据范围和环境一致，而不是把不同条件的结果连成一条漂亮的曲线。",
    "s5.title": "做一个自己用的工作台",

    "s5.p2": "实现上是 Python 标准库的 HTTP 服务加本地数据库，前端是原生 HTML/JS，由 AI 辅助实现。我把判断和整合交给高能力模型，调查和重复性工作交给轻量模型，用这个工作台让人和 AI 看同一份数据。我每天在用，也在用中继续改。",
    "s6.title": "错误数据：不只修数据，把修法做成 pipeline",

    "s6.p2": "我走了两条路。一条针对现有数据：把每一类错误的修正逻辑写成可复用、可迭代的 transform 清理工具，而不是一次性的 SQL。transform 带 dry-run 和备份，明确哪些要修、哪些看起来异常但其实合法要保留。另一条针对源头：把同一套修正逻辑以镜像 PR 的形式提交到生产 pipeline 对应的环节（抽取、校验或入库），从源头减少同类错误再次出现。对以后可能出现的新形态，同一套 transform 可以继续补规则、验证和迭代。",
    "s6.p3": "执行也是我自己做：在生产环境里先 dry-run，核对差异，备份，再正式执行、后检，再把结果写进 PR 和任务记录。一个半月里，这样解决了 38 件错误数据任务。",
    "s7.title": "苦労したこと・工夫したこと",

    "s7.i1.b": "错误出现在输出，原因却可能在输入、前处理、模型抽取或后段校验的任何一层。我的做法是沿处理链逐层比较：原文有、处理后没有，是哪一步丢的；原文没有、输出有，是哪一步造出来的。先确认信息有没有到模型手里，再怀疑模型能力。",

    "s7.i3.t": "修复会不会伤到正常数据",

    "s7.i4.t": "怎么证明修好了",

    "s7.i5.t": "接受 review，把性能和边界补上",
    "s7.i5.b": "一次针对异常页的处理在 review 中被指出：普通页反而成了最慢的情况。我改成先判定是否存在异常、没有就直接走原路径，并补上短文档和字符规范化的边界验证。review 是更快发现修法缺点的方式，我把这些指摘都当作验收标准的一部分。",
    "s7.i6.t": "让 AI 解释业务合理性，安排反证",

    "s8.note": "数字为本人按工作记录统计，2026 年 10 月时点。",

    "resume.button": "Résumé",
    "page.title": "My toughest development project",
    "page.lead": "At Baseconnect: turning individual data corrections into a process I could reuse and improve",
    "tldr": "During my AI engineering internship at Baseconnect, I worked directly with production data in S3 that is delivered to clients. I modified the data pipeline, built reusable transformations for recurring data errors, and submitted corresponding fixes to the production pipeline to reduce those errors at the source.",
    "tldr.more": "Over three months, about 320 working hours, I authored 190 PRs that were merged. Within that period, the final month and a half, about 180 hours, focused on data errors, with 38 tasks resolved. I designed a workflow for recording AI investigations and my decisions, turning corrections into reusable tools and feeding the fixes back into the production pipeline. During this work, accuracy for one data field rose from over 40% to 85%, and its coverage rose from over 30% to 75%.",
    "facts.stack.t": "Technology and tools",
    "facts.stack.b": "Python, SQL, AWS S3 for production data delivered directly to clients, LLM APIs for extraction and validation, automated tests, and GitHub PRs and reviews. Claude assists coding. My own workspace uses a Python standard-library HTTP server, a local database, and plain HTML and JavaScript.",
    "facts.team.t": "Team and development process",
    "facts.team.b": "A team project, with issues raised by the data team and client feedback. The process is investigation → proposed correction → PR → colleague review → merge → verification environment checks → production. I personally execute data corrections in production, starting with a dry run, then execution and post-checks. I am a part-time intern.",
    "facts.role.t": "My responsibilities and division of work",
    "facts.role.b": "I define problems and goals, assess AI findings, decide the correction approach and scope, review high-risk areas, create PRs, write acceptance criteria, verify and document results after merging, and execute data corrections. Claude assists with investigation and reproduction, separating possible causes, code and test proposals, and organizing lists and commands. Colleagues review code for performance, edge cases, and metric definitions, provide the original issues and business definitions, and maintain the existing job framework.",
    "facts.content.t": "What I developed",
    "facts.content.b": "① Investigation and fix PRs for missing extractions, incorrect extractions, and data errors across input → preprocessing → model extraction → validation → database ingestion. ② Evaluation methods: row-level scoring, tests with counterexamples, and before-and-after comparisons using two sample sets. ③ Data correction: reusable transformation tools, corresponding production pipeline fix PRs, and execution of production corrections. ④ A workspace for my own use: tasks, batches, verification results, next steps, and logs.",
    "facts.links.t": "References",
    "facts.links.b": "Internship code is in the company’s internal repository. This page describes my work through investigation methods, decision criteria, and verification. Personal work includes the CorpLink-AI source on GitHub, a portfolio of three web apps I use, and my résumé in PDF. Links are at the end of the page.",
    "s1.title": "What the company does, and what I do",
    "s1.p1": "Baseconnect provides a company information database. It structures company, department, person, and contact information from public sources such as websites and PDFs for clients to use. A production pipeline takes data through collection, extraction, validation, and ingestion, with model-based extraction as one step.",
    "s1.p2": "In 2026, I joined as an AI engineering intern, working on extraction quality: investigating missing and incorrect results, modifying the production pipeline, designing evaluations, and correcting existing data. I set up my own working environment for investigating and modifying the pipeline using production data in S3 that is delivered directly to clients. I verify code changes against that data before submitting PRs, and personally execute data corrections in production.",
    "s2.title": "First, I designed a workflow for myself",
    "s2.p1": "At the start of the internship, I faced a running production pipeline, unfamiliar business data, and a large existing codebase. I used Claude to assist development, but findings could be lost between conversations, and plausible-looking code could fail to meet business needs. I organized my daily work into nine steps, with responsibility made explicit at each stage:",
    "s2.p2": "Five steps center on my judgment, two on AI execution, and two on keeping records. AI helps with investigation and implementation; I take responsibility for defining the problem, assessing the approach and risks, and verifying the result. This workflow structures my development, review, and verification work.",
    "s3.title": "Keep a record of investigations and decisions",
    "s3.p1": "I keep three kinds of records. First, acceptance criteria in a .md file: before changing code, I define what counts as fixed, which records are in scope, which comparison samples to use, which valid records must be preserved, and what log evidence will show a new mechanism actually ran. Second, verification results in PR comments: before-and-after comparisons, effects on valid data, and evidence that the mechanism ran remain available to reviewers and my future self. Third, work logs: investigation, dry run, execution, and post-check results go into the workspace and logs, so a new AI session can read them and continue.",
    "s3.p2": "The reasons are practical. Without criteria agreed in advance, verification can become a judgment that the result merely looks fine. With records scattered across conversations, the next session needs the whole story again. Keeping these records lets reviewers check the evidence and new sessions continue the work.",
    "s4.title": "Bring earlier project management experience into the work",
    "s4.p1": "At a travel company, I organized business requirements, coordinated development schedules, and followed up on testing. When running my own studio, I documented recurring procedures and delegated them to customer support. Those experiences taught me to break work into units I could track. In this internship, I split a ticket into task → processing batch → stage event. Every active batch has a next action, owner, linked PR, and file path. Code merge, dry run, production execution, and post-checks are recorded as separate stages.",
    "s4.p2": "I apply the same approach to data objects. Stable business keys link results for the same object across batches, and I check that data scope and environment match before comparing results. That keeps comparisons tied to equivalent conditions.",
    "s5.title": "Build a workspace for my own use",
    "s5.p1": "Long-running work with AI brought four recurring problems: earlier decisions and procedures were forgotten; investigation and verification results were scattered; I had to remember and explain everything again; and growing context increased both cost and noise. I built a database-backed dashboard to retain task and batch status, PR acceptance status and checklists, verification results and issue categories, work logs, data error detection rule status and trends, and a starting point for the next session.",
    "s5.p2": "It uses a Python standard-library HTTP server, a local database, and a plain HTML and JavaScript frontend, implemented with AI assistance. I use more capable models for judgment and integration and lighter models for investigation and repetitive work. The workspace lets me and the AI work from the same records. I use and refine it every day.",
    "s6.title": "Build a reusable process for data corrections",
    "s6.p1": "Production data can contain mixed department names, incorrect person-to-company associations, or inconsistent job classifications. These records are stored in S3 and delivered directly to clients. Individual corrections resolve current cases; reducing repeated errors also requires finding the pipeline step that produces them.",
    "s6.p2": "I worked along two paths. For existing data, I wrote each class of correction as a reusable transformation tool that could be improved over time. Each tool supports dry runs and backups, with a clear distinction between records to correct and unusual-looking but valid records to keep. For the source, I submitted the corresponding correction to the relevant extraction, validation, or ingestion step in the production pipeline. These corresponding pipeline fix PRs are what I call mirror PRs. The transformation tools can then be extended and verified as new variations appear.",
    "s6.p3": "I execute the corrections myself in production: run a dry run, check the differences, back up the data, execute, run post-checks, and record the results in the PR and task history. I resolved 38 data error tasks this way over a month and a half.",
    "s7.title": "Challenges and decisions",
    "s7.i1.t": "Find where recurring errors are introduced",
    "s7.i1.b": "An error appears in the output, but its cause may be in the input, preprocessing, model extraction, or later validation. I compare each stage: if information exists in the source but disappears, where was it lost? If it appears only in the output, where was it introduced? I first check whether the model received the information it needed.",
    "s7.i2.t": "Reproduce a hypothesis on real data before changing code",
    "s7.i2.b": "In one case, names extracted from PDFs contained repeated characters, producing names that did not exist. We first suspected reordering during HTML conversion, then personnel changes in the source material. Neither hypothesis was supported by the data. I asked for reproduction on real data. When the AI inspected PDF character coordinates, we found slightly offset, overlapping copies of the same character used to create bold text. I established the cause before choosing a fix.",
    "s7.i3.t": "Protect valid data during correction",
    "s7.i3.b": "The hardest part of cleanup is distinguishing errors from unusual but legitimate records. Cases that cannot be classified reliably go to upstream processing or manual confirmation. Each batch starts with a dry run and difference review, then backup and execution. Post-checks count both corrected records and newly introduced errors.",
    "s7.i4.t": "Show that the fix works",
    "s7.i4.b": "I write acceptance criteria in a .md file before merging. I check logs to confirm the new mechanism ran, then use the same comparison samples before and after the change, counting correct and incorrect results separately. Verification results stay in PR comments for reviewers to check directly.",
    "s7.i5.t": "Use review to improve performance and edge cases",
    "s7.i5.b": "A reviewer found that a fix for unusual pages made ordinary pages the slowest case. I changed it to check for the anomaly first and follow the original path when absent, then added verification for short documents and character normalization boundaries. I use review feedback to improve the fix and its acceptance criteria.",
    "s7.i6.t": "Ask AI to explain the business logic and test the assumptions",
    "s7.i6.b": "I ask Claude to explain the proposal and tradeoffs in plain language, then question it against business constraints. An agent with no earlier conversation context looks for counterexamples and reviews the approach. When a counterexample overturns an assumption, I revise the approach or narrow the scope, keeping uncertain data available for further judgment.",
    "s8.title": "Results",
    "s8.p1": "Over three months, about 320 working hours, I authored 190 PRs that were merged. Within that period, the final month and a half, about 180 hours, focused on data errors, with 38 tasks resolved. During this work, accuracy for one data field rose from over 40% to 85%, and its coverage rose from over 30% to 75%. The workspace, acceptance criteria, and PR verification comments connect correction work to its evidence and results.",
    "s8.note": "Figures compiled from my work records as of October 2026.",
    "s9.title": "Make repeated work into tools that can improve",
    "s9.p1": "What matters most to me in this experience is turning recurring work into processes and tools I can keep improving: a nine-step workflow, recorded decisions and verification, trackable batches, and reusable transformations whose fixes feed back into the production pipeline. The same idea runs through CorpLink-AI, my work dashboard, and my three everyday apps: reduce repeated work and keep earlier records and decisions useful.",

    "links.repo": "Internship code is in the company’s internal repository. This page explains the methods, evidence, and verification used in my work.",

  "ja": {
    "back": "戻る",
    "footer.left": "© 2026 楊 天楽",
    "footer.right": "GitHub Pagesで公開",
    "resume.button": "職務経歴書",
    "page.title": "最も難しかった開発経験",
    "page.lead": "Baseconnectで、データ修正を1件ずつの対応から、継続して改善できるパイプラインへ",
    "tldr": "BaseconnectでAIエンジニアのインターンとして、S3上の、顧客に直接提供される本番データを扱い、データ生成パイプラインを改善しています。繰り返し発生するデータの誤りを、再利用・改善できるtransformで修正するとともに、対応する本番パイプラインの修正PRを作成し、発生源から同じ問題を減らしています。",
    "tldr.more": "3か月、約320時間で190件のPRを作成し、マージまで進めました。そのうち後半の1.5か月、約180時間ではデータ修正に集中的に取り組み、38件のタスクを解決しました。個別の依頼に対応するだけでなく、自分の作業の流れを先に設計し、AIによる調査と自分の判断を記録。修正方法をツールにし、本番パイプラインの改善にも反映しました。取り組みの中で、特定のデータ項目の精度は40％台から85％に、データカバー率は30％台から75％に改善しました。",
    "facts.stack.t": "技術・ツール",
    "facts.stack.b": "Python、SQL、AWS S3（顧客に直接提供される本番データ）、LLM API（抽出・検証でのモデル呼び出し）、自動テスト、GitHub（PR・レビュー）。AIによる開発支援にはClaudeを使用。自分用のダッシュボードは、Python標準ライブラリのHTTPサーバー、ローカルデータベース、HTML/JSで構成しています。",
    "facts.team.t": "チームと開発の流れ",
    "facts.team.b": "チームで開発し、データチームや顧客からの指摘をもとに調査しています。コードの変更は、調査 → 修正案 → PR → 同僚によるレビュー → マージ → 検証環境での確認 → 本番反映の順で進めます。既存データの修正は私が本番環境で直接実施し、dry-run、実行、実行後の確認を行っています。雇用形態はアルバイトのインターンです。",
    "facts.role.t": "担当と役割分担",
    "facts.role.b": "私：課題・目標の定義、AIの調査結果の妥当性判断、修正方針と対象範囲の決定、リスクの高い箇所の確認、PRの作成、受け入れ基準の記載、マージ後の検証・記録、本番データの修正。Claude：調査・再現、原因候補の切り分け、コード案・テストコードの作成、対象リストやコマンドの整理。同僚：コードレビュー（性能、境界条件、集計基準）、課題や業務上の定義の共有、既存の作業フレームワークの保守。",
    "facts.content.t": "開発内容",
    "facts.content.b": "① 入力 → 前処理 → モデルによる抽出 → 検証 → 保存の各段階をたどり、抽出漏れ・誤抽出・データの誤りを調査して修正PRを作成。② 行単位の評価、反例を含む検証、変更前後の2組のサンプルを使った比較など、評価方法を設計。③ 再利用できるtransformによる既存データの修正、対応する本番パイプラインの修正PR、本番環境での修正作業。④ タスク、処理バッチ、検証結果、次の作業、ログを管理する自分用のダッシュボード。",
    "facts.links.t": "参考資料",
    "facts.links.b": "インターンで扱うコードは社内リポジトリにあります。このページでは調査方法、判断の根拠、検証の進め方から業務内容を紹介しています。個人開発の参考資料は、CorpLink-AIのソースコード（GitHub）、運用中の3つのWebアプリを紹介したポートフォリオ、職務経歴書（PDF）です。ページ末尾にリンクを掲載しています。",
    "s1.title": "会社の事業と、私の担当",
    "s1.p1": "Baseconnectは企業情報データベースを提供する会社です。WebページやPDFなどの公開情報から、企業、部署、人物、連絡先を構造化し、顧客に提供しています。収集、抽出、検証、保存を行う本番パイプラインがあり、モデルによる抽出もその一部です。",
    "s1.p2": "2026年からAIエンジニアのインターンとして、企業情報の抽出品質の改善に取り組んでいます。抽出漏れや誤抽出、データの誤りの原因を調べ、データ生成パイプラインのコードを修正し、評価方法を設計し、既存データを修正しています。S3上のデータは、顧客に直接提供される本番データです。コードの変更は同じデータを使って検証してからPRにし、既存データの修正は私が本番環境で直接実行しています。",
    "s2.title": "インターンの開始時に、自分の作業の流れを設計する",
    "s2.p1": "インターンを始めたとき、扱うのは稼働中の本番パイプライン、初めて触れる業務データ、大量の既存コードでした。Claudeを使って開発を進める一方、調査結果が会話の中に埋もれたり、もっともらしいコード案が業務の要件に合わなかったりする問題がありました。そこで、作業を9段階に整理し、各段階の役割を明確にしました。",
    "s2.p2": "9段階のうち、5段階は私が判断・実行し、2段階はAIに依頼し、2段階は記録を残します。AIには調査と実装を支援してもらい、課題の定義、妥当性やリスクの判断、最終的な検証は私が担当します。この流れを、その後の開発、レビュー、検証の基本にしています。",
    "s3.title": "AIの調査と、自分の判断を記録する",
    "s3.p1": "記録を残す場所は3つです。まず、受け入れ基準を.mdに書きます。変更前に、対象、比較用サンプル、影響させてはいけない正常データ、新しい処理が動いたことをログでどう確認するかを定めます。次に、検証結果をPRのコメントに残します。変更前後の比較、正常データへの影響、処理が動いた記録を、レビューする人や後から読む自分が確認できます。最後に、調査、dry-run、実行、実行後の確認をダッシュボードとログに記録し、新しいAIセッションではそれを読んで作業を再開します。",
    "s3.p2": "基準を先に決めることで、検証を「見たところ問題なさそう」で終わらせずに済みます。また、記録をまとめておけば、次の会話で経緯を最初から説明する手間も減ります。レビューする人が根拠を確認でき、次のセッションでも作業を続けられる形を目指しました。",
    "s4.title": "以前の業務経験を生かし、作業を追える単位に分ける",
    "s4.p1": "旅行会社では業務要件を整理し、開発側と日程を調整してテストを進めました。自分のスタジオの運営では、繰り返す業務を手順にして、カスタマーサポート担当者と分担しました。こうした経験から、仕事を進捗の追える単位に分ける習慣があります。インターンでは、1つのチケットを「タスク → 処理バッチ → 各段階の実施記録」に分け、進行中のバッチごとに次の作業、担当者、関連PR、資料のパスを記録しています。マージ、dry-run、本番実行、実行後の確認を、それぞれの段階として管理しています。",
    "s4.p2": "データの比較でも、同じ対象を業務上の一意なキーで結び、異なるバッチの結果を追えるようにしています。比較する前には、対象範囲と環境が一致しているかを確かめ、条件の異なる結果をそのまま一つの推移として扱わないようにしています。",
    "s5.title": "自分用の作業ダッシュボードをつくる",
    "s5.p1": "AIと長い作業を進めると、過去の判断や手順が抜け落ちる、調査・検証結果が会話ごとに散らばる、人がすべて覚えて説明し直す必要がある、文脈が増えるほどコストとノイズが増える、という問題が繰り返し起きました。そこで、データベースを備えた自分用のダッシュボードをつくりました。タスクと処理バッチの状態、PRの受け入れ状況と基準のチェックリスト、検証結果と問題の分類、作業ログ、データの誤りを検出するルールの状態や推移、次のセッションで作業を再開するための情報を保存しています。",
    "s5.p2": "Python標準ライブラリのHTTPサーバーとローカルデータベース、HTML/JSの画面を、AIの支援を受けて実装しました。判断や統合には高性能なモデル、調査や繰り返し作業には軽量なモデルを使い、人とAIが同じ記録を参照できるようにしています。毎日使いながら、改善を続けています。",
    "s6.title": "データの修正方法を、継続して使えるパイプラインにする",
    "s6.p1": "本番データには、部署名の混在、人物と所属の対応誤り、役職分類の不一致などが生じることがあります。これらはS3に保存され、顧客に直接提供されるデータです。個別の修正に加え、同じ問題の再発を減らすには、パイプラインのどこで誤りが生じているかを特定する必要があります。",
    "s6.p2": "既存データと発生源の両方に取り組みました。既存データには、誤りの種類ごとに、再利用・改善できるtransformを作成しました。dry-runとバックアップを備え、修正対象と、一見不自然でも業務上正しいため残す対象を分けています。発生源には、同じ修正方針を本番パイプラインの該当する処理に反映するPRを作成しました。抽出、検証、保存の処理を直して、同じ誤りの再発を減らすためです。新しい形の問題が見つかった場合も、同じtransformにルールを追加し、検証と改善を続けられます。",
    "s6.p3": "本番環境でのデータ修正も私が実行しています。dry-runで差分を確認し、バックアップを取って実行し、その後に結果を確認。PRとタスクの記録に結果を残します。1.5か月で38件のデータ修正タスクを解決しました。",
    "s7.title": "苦労したこと・工夫したこと",
    "s7.i1.t": "繰り返す誤りを、発生した処理までたどる",
    "s7.i1.b": "誤りが見えるのは出力でも、原因は入力、前処理、モデルによる抽出、後段の検証のどこにでもあり得ます。私は処理の段階ごとに比較し、原文にある情報がどこで消えたか、原文にない情報がどこで生まれたかを調べています。まず、必要な情報がモデルに届いていたかを確かめ、そのうえでモデルの問題を検討します。",
    "s7.i2.t": "実データで再現し、仮説を確かめてから修正する",
    "s7.i2.b": "PDFから抽出した人名に同じ文字が重なり、存在しない名前が生成されたことがありました。当初はHTMLへの変換時の並べ替えや、資料の人事異動の記載を疑いましたが、どちらもデータでは裏付けられませんでした。そこで、実データで再現するようClaudeに依頼し、PDF内の文字座標を調べました。原因は、太字を表現するために、同じ文字を少しずらして重ね描きしていたことでした。原因を確かめてから修正方法を決める順序を大切にしています。",
    "s7.i3.t": "誤りを直すとき、正常データを守る",
    "s7.i3.b": "データ修正で難しいのは、誤りと、一見不自然でも業務上正しいデータを分けることです。確実に判断できない対象は、上流の処理や人による確認に回します。各バッチでdry-runの差分を確認し、バックアップを取ってから実行。実行後には、修正できた件数と新たに誤りが生じた件数を、両方確認しています。",
    "s7.i4.t": "何を確認すれば、修正できたと言えるか",
    "s7.i4.b": "マージ前に受け入れ基準を.mdに記載します。問題のデータが出なくなったことだけでなく、新しい処理が実際に動いたことをログで確認します。変更前後は同じ比較用サンプルを使い、正しい結果と誤った結果を分けて集計。検証結果をPRのコメントに残し、レビューする人が直接確かめられるようにしています。",
    "s7.i5.t": "レビューで性能と境界条件を見直す",
    "s7.i5.b": "異常なページへの対応をレビューしてもらった際、通常のページが最も遅くなる実装になっていると指摘されました。異常の有無を先に判定し、なければ元の処理をそのまま通す形に修正しました。短い文書や文字の正規化についても境界条件を検証しました。レビューの指摘を受け入れ基準にも取り込み、修正案の弱点を早く見つけるために役立てています。",
    "s7.i6.t": "業務上の妥当性を確かめ、反例を探す",
    "s7.i6.b": "Claudeには、方針と選択理由を平易な言葉で説明するよう求め、業務上の制約から疑問点を確認します。前の議論に参加していないエージェントにも、別の文脈で反例の検討とレビューを依頼します。前提が成り立たないと分かった場合は、方針を変えたり、対象範囲を狭めたりしています。アラートを消すために、判断のつかないデータまでまとめて修正することは避けています。",
    "s8.title": "結果",
    "s8.p1": "3か月、約320時間で190件のPRを作成し、マージまで進めました。そのうち後半の1.5か月、約180時間ではデータ修正に集中的に取り組み、38件のタスクを解決しました。特定のデータ項目の精度は40％台から85％に、データカバー率は30％台から75％に改善しました。ダッシュボード、受け入れ基準の.md、PRのコメントに残した検証記録から、修正の根拠と結果を確認できるようにしています。",
    "s8.note": "数値は本人の業務記録に基づく集計（2026年10月時点）。",
    "s9.title": "同じ問題への対応を、改善し続けられるツールにする",
    "s9.p1": "この経験で重視したのは、繰り返す作業を、改善し続けられる流れとツールにすることです。作業を9段階に整理し、判断と検証を記録し、タスクを進捗の追えるバッチに分け、データ修正の方法をtransformにして本番パイプラインにも反映しました。CorpLink-AI、自分用のダッシュボード、日常で使う3つのアプリにも共通する考え方です。過去の記録や判断を次に使い、同じ作業を繰り返す手間を減らしたいと考えています。",
