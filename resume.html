  document.querySelectorAll('[data-style][data-format]').forEach(link => {
    const style = link.dataset.style;
    const format = link.dataset.format;
    // 履歴書は日本語の様式のため、どの表示言語でも同じ日本語ファイルを渡す。
    const fileLang = style === 'rirekisho' ? 'ja' : lang;
    const filename = style === 'rirekisho' ? `楊_天楽（Yo_Tenra）_履歴書.${format}` : `${documents[lang].name}_${documents[lang].experience}.${format}`;
    link.href = `assets/resumes/${fileLang}/${style}/${encodeURIComponent(filename)}?v=20261111`;
    link.download = filename;
    link.hreflang = fileLang;
    const title = t[style === 'rirekisho' ? 'rirekisho.title' : 'formal.title'];
    link.setAttribute('aria-label', `${title} — ${t[`download.${format}`]}`);
  });
  document.querySelectorAll('[data-pages]').forEach(label => {
    label.textContent = t['pdf.pages'].replace('{pages}', String(pages[label.dataset.pages]));
  });
}
