function render(lang, t) {
  document.querySelectorAll('[data-style][data-format]').forEach(link => {
    const style = link.dataset.style;
    const format = link.dataset.format;
    const filename = `yo-tenra-${lang}-${style}.${format}`;
    link.href = `assets/resumes/${filename}`;
    link.download = filename;
    link.hreflang = lang;
    const title = t[style === 'projects' ? 'natural.title' : 'formal.title'];
    link.setAttribute('aria-label', `${title} — ${t[`download.${format}`]}`);
  });
}
