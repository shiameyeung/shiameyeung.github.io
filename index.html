<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楊　天楽</title>
<meta name="description" content="楊 天楽 のホームページ。自分のために作った Web アプリと、修士研究のデモ。">
<meta property="og:title" content="楊　天楽">
<meta property="og:description" content="自分のために作った Web アプリと、修士研究のデモ。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yotenra.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🌿%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#23201f; --muted:#6f6763; --line:#e7e0d9; --bg:#fbf9f6; --card:#fff;
    --accent:#2f6f5e; --accent-soft:#eef4f1;
    --radius:20px;
    --latin:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  /* 中日で同じ字形になると、どちらの読者にも違和感が残る：言語ごとに和文フォントを切り替える。
     palt（詰め組み）は日本語だけ。中国語にかけると句読点が半角のように見える。 */
  body{margin:0;color:var(--ink);background:var(--bg);line-height:1.75;letter-spacing:.01em;
       font-family:var(--latin),"Hiragino Sans","Noto Sans JP",sans-serif}
  html[lang^="ja"] body{font-family:var(--latin),"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
                        font-feature-settings:"palt"}
  html[lang^="zh"] body{font-family:var(--latin),"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
  html[lang^="en"] body{font-family:var(--latin),sans-serif}
  a{color:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px}

  /* 語言切り替え：右上に固定せず、内容の一部として置く */
  .langbar{display:flex;justify-content:flex-end;gap:4px;padding:20px 0 0}
  .langbar button{font:inherit;font-size:13px;padding:6px 13px;border:1px solid transparent;border-radius:999px;
                  background:none;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .langbar button:hover{background:#f2ede7;color:var(--ink)}
  .langbar button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

  header{padding:64px 0 66px;border-bottom:1px solid var(--line);position:relative}
  header::before{content:'';position:absolute;inset:-40px -30% 0 -10%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(42% 62% at 82% 18%,#f6dfe9aa,transparent 70%),
      radial-gradient(38% 55% at 62% 72%,#dcecdfaa,transparent 70%),
      radial-gradient(34% 50% at 96% 62%,#e2e0f3aa,transparent 70%);
    filter:blur(6px)}
  body{position:relative;z-index:0}
  .name{font-size:clamp(34px,6vw,52px);line-height:1.2;margin:0 0 16px;letter-spacing:.06em;font-weight:700}
  .name .romaji{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:500;margin-top:12px}
  .tagline{font-size:clamp(15px,2.2vw,18px);color:var(--muted);margin:0;max-width:34em}

  section{padding:60px 0}
  section+section{border-top:1px solid var(--line)}
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);margin:0 0 10px;font-weight:600}
  h2{font-size:clamp(22px,3.4vw,28px);margin:0 0 10px;letter-spacing:.04em}
  .lead{color:var(--muted);margin:0 0 34px;max-width:40em}

  .works{display:grid;gap:26px}
  .work{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
        display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .work:nth-child(even){grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
  .work:nth-child(even) .shot{order:2}
  .shot{background:#f4f0ec;overflow:hidden;display:block}
  .shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--pos,center top)}
  .work-body{padding:30px 30px 28px;display:flex;flex-direction:column;gap:12px}
  .work h3{margin:0;font-size:20px;letter-spacing:.03em}
  .work .sub{margin:0;color:var(--muted);font-size:13px}
  .work p.desc{margin:0;font-size:14.5px;color:#4a4340}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tags span{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fdfcfa}
  .work-links{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:auto;padding-top:6px}
  .go{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
  .go:hover{text-decoration:underline}
  .go svg{width:14px;height:14px}
  .note{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .note svg{width:12px;height:12px;opacity:.7}

  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .links a{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--card);
           border:1px solid var(--line);border-radius:15px;text-decoration:none;font-size:14.5px;transition:border-color .15s,transform .15s}
  .links a:hover{border-color:#cfc5ba;transform:translateY(-1px)}
  .links svg{width:19px;height:19px;flex:0 0 19px;color:var(--muted)}

  footer{padding:44px 0 56px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;
         justify-content:space-between;gap:16px;flex-wrap:wrap}

  @media(max-width:760px){
    .wrap{padding:0 18px}
    header{padding:34px 0 42px}
    section{padding:44px 0}
    .work,.work:nth-child(even){grid-template-columns:1fr}
    .work:nth-child(even) .shot{order:0}
    .shot img{height:auto;aspect-ratio:16/10}
    .work-body{padding:22px 20px 24px}
    .works{gap:20px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

    <button type="button" data-lang="zh" lang="zh-Hans">简体中文</button>

  <header>

  <section id="works">

  <section id="links">
    <p class="eyebrow" data-t="links.eyebrow"></p>
    <h2 data-t="links.title"></h2>
    <p class="lead" data-t="links.lead"></p>
    <div class="links">
      <a href="https://github.com/shiameyeung" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span data-t="links.github"></span></a>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span data-t="links.wantedly"></span></a>
      <a href="https://jglobal.jst.go.jp/search/researchers?q=%E6%A5%8A%20%E5%A4%A9%E6%A5%BD" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z"/><path d="M20 18v3H6.5"/></svg>
        <span data-t="links.jglobal"></span></a>
      <a href="https://www.instagram.com/tenra.yo/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span data-t="links.instagram"></span></a>
    </div>
  </section>

  <footer>
    <span data-t="footer.left"></span>
    <span data-t="footer.right"></span>
  </footer>
</div>

<script>
const ARROW = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h11M11 5.5 15.5 10 11 14.5"/></svg>';
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>';

    tags:['Next.js','Cloudflare D1','Drizzle ORM'] },

    'cal.title':'CalTracker · 要杜杜，不要肚肚',
    'cal.sub':'cal.yotenra.com',
    'cal.desc':'按日本时间记录每天吃了多少、体重多少，看三十天的趋势。食品库可以搜索和自定义，每天的目标按原本用惯的表格公式算。',
    'aws.title':'AWS Pass It',
    'aws.sub':'aws.yotenra.com',
    'aws.desc':'自己考 AWS 认证时做的刷题应用。题目和术语表都有中英日三份，做错的题会留在错题本里，进度跨设备同步，离线也能刷。',

    'sna.desc':'把开源生态的依赖关系画成网络，用中心性等指标找出关键包和断点。诊断文字由规则和模板生成，不经过 AI，同样的数据永远得到同样的结论。',
  },

    'tagline':'I build small tools for the things I do every day. Here are a few web apps I made for myself, plus the demo from my master’s research.',

  },
};

function renderWorks(lang) {
  const t = T[lang];
  document.getElementById('work-list').innerHTML = WORKS.filter(w => !w.skip).map(w => `
    <article class="work">
      <a class="shot" href="${w.url}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
        <img src="${w.shot}" alt="" loading="lazy" decoding="async" style="--pos:${w.pos || 'center top'}">
      </a>
      <div class="work-body">
        <h3>${t[w.id + '.title']}</h3>
        <p class="sub">${t[w.id + '.sub']}</p>
        <p class="desc">${t[w.id + '.desc']}</p>
        <div class="tags">${(w.tags || []).map(x => `<span>${x}</span>`).join('')}</div>
        <div class="work-links">
          <a class="go" href="${w.url}" target="_blank" rel="noopener">${t.open}${ARROW}</a>
          <span class="note">${w.private ? LOCK + t.private : t.demo}</span>
        </div>
      </div>
    </article>`).join('');
}

function apply(lang) {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (v !== undefined) el.textContent = v; });
  document.querySelectorAll('.langbar button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderWorks(lang);
  try { localStorage.setItem('yotenra.lang', lang); } catch (_) { /* プライベートモードでは記憶しない */ }
}

function initialLang() {
  try { const saved = localStorage.getItem('yotenra.lang'); if (T[saved]) return saved; } catch (_) {}
  for (const l of navigator.languages || [navigator.language || '']) {
    const code = l.toLowerCase();
    if (code.startsWith('ja')) return 'ja';
    if (code.startsWith('zh')) return 'zh';
    if (code.startsWith('en')) return 'en';
  }
  return 'ja';
}

document.querySelector('.langbar').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (b) apply(b.dataset.lang);
});
apply(initialLang());
</script>
